                </tbody>
              </table>
            </div>
          </div>

          <div style={{ marginTop: 14, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <span style={{ fontSize: 12, color: C.tintaSuave }}>El porqué de las caídas, si son oportunidad o trampa, y qué empresas mirar dentro de los sectores castigados:</span>
            <Boton secundario onClick={analizarIA} deshabilitado={analizando}>{analizando ? "Investigando…" : "Explicar con noticias"}</Boton>
          </div>

          {radar.analisis && (
            <div style={{ background: C.blanco, border: "1px solid " + C.linea, borderRadius: 6, padding: "18px 22px", marginTop: 10 }}>
              <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, marginBottom: 6 }}>
                ANÁLISIS · {radar.analisisFecha ? new Date(radar.analisisFecha).toLocaleString("es-ES") : ""}
              </div>
              <Markdown texto={radar.analisis} />
            </div>
          )}
        </div>
      ) : (
        <div style={{ background: C.blanco, border: "1px dashed " + C.linea, borderRadius: 6, padding: 40, textAlign: "center", marginTop: 10 }}>
          <p style={{ fontFamily: fontDisplay, fontSize: 17, margin: "0 0 8px" }}>«Sé codicioso cuando los demás tienen miedo»</p>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: 0 }}>Escanea el mercado para ver qué sectores están en corrección o en pánico — de ahí sale la lista de la compra del value investor.</p>
        </div>
      )}
    </div>
  );
}

// ---------- Seguimiento activo: historial nota/precio y señales value ----------
function notaDe(a) { const c = a ? notaCuantitativa(a) : null; return c ? c.nota : null; }

function senalValue(ant, ult) {
  if (!ant || !ult || ant.nota == null || ult.nota == null || !ant.precio || !ult.precio) return null;
  const dNota = ult.nota - ant.nota;
  const dPrecio = ult.precio / ant.precio - 1;
  if (dNota >= 0 && dPrecio <= -0.05) return { tipo: "compra", texto: "SEÑAL VALUE · mejora y se abarata", color: "#1E6B4E" };
  if (dNota > 0 && dPrecio < 0) return { tipo: "compra", texto: "señal suave · mejora y baja", color: "#1E6B4E" };
  if (dNota < 0 && dPrecio >= 0.05) return { tipo: "alerta", texto: "ojo · empeora y se encarece", color: "#B3372E" };
  return null;
}

async function actualizarSeguimiento(tickers, apiKey, roicKey, alProgreso) {
  const resultados = {};
  for (let i = 0; i < tickers.length; i++) {
    const t = tickers[i];
    if (alProgreso) alProgreso(i + 1, tickers.length, t);
    try {
      let a = null;
      if (apiKey) {
        try { a = await analizarTicker(t, apiKey); }
        catch (e) { if (!roicKey) throw e; }
      }
      if (!a && roicKey) a = await analizarTickerRoic(t, roicKey);
      if (a && a.fuente !== "roic" && roicKey && a.limitaciones && a.limitaciones.length >= 3) {
        try { const b = await analizarTickerRoic(t, roicKey); if (b) a = b; } catch (e2) { /* mantenemos FMP */ }
      }
      resultados[t] = a;
    } catch (e) { resultados[t] = null; }
    if (i < tickers.length - 1) await new Promise(function (r) { setTimeout(r, 500); });
  }
  return resultados;
}

function Seguimiento({ apiKey, roicKey, watchlist, setWatchlist, analisis, setAnalisis, historial, setHistorial, setAviso, irAAjustes, abrirAnalisis }) {
  const [actualizando, setActualizando] = useState(false);
  const [progreso, setProgreso] = useState("");

  const actualizar = async () => {
    if (!watchlist.length || actualizando) return;
    if (!apiKey && !roicKey) { setAviso("Guarda al menos una clave de datos en Ajustes"); irAAjustes(); return; }
    setActualizando(true);
    const res = await actualizarSeguimiento(watchlist, apiKey, roicKey, function (i, n, t) { setProgreso(t + " (" + i + "/" + n + ")"); });
    const nuevoHist = { ...(historial || {}) };
    const nuevoAnalisis = { ...analisis };
    let fallidos = [];
    Object.keys(res).forEach(function (t) {
      const a = res[t];
      if (!a) { fallidos.push(t); return; }
      nuevoAnalisis[t] = { ...a, cualitativa: analisis[t] ? analisis[t].cualitativa : undefined, tendencia: analisis[t] ? analisis[t].tendencia : undefined };
      const lista = (nuevoHist[t] || []).slice(-29);
      lista.push({ fecha: new Date().toISOString(), nota: notaDe(a), precio: a.precio });
      nuevoHist[t] = lista;
    });
    setAnalisis(nuevoAnalisis);
    setHistorial(nuevoHist);
    if (fallidos.length) setAviso("Sin datos para: " + fallidos.join(", "));
    setProgreso("");
    setActualizando(false);
  };

  const quitar = (t) => {
    setWatchlist(watchlist.filter(function (x) { return x !== t; }));
    if (historial && historial[t]) {
      const nuevo = { ...historial };
      delete nuevo[t];
      setHistorial(nuevo);
    }
  };

  const [ordenSeg, alternarSeg] = usarOrden(null);
  /* Qué empresas tienen los puntos a la vista. Cerradas de entrada: la tabla
     contesta «cómo va» y los puntos contestan «desde cuándo», que es otra
     pregunta y no se hace siempre. */
  const [abiertas, setAbiertas] = useState([]);
  const abrirCerrar = function (t) {
    setAbiertas(function (ya) { return ya.indexOf(t) === -1 ? ya.concat([t]) : ya.filter(function (x) { return x !== t; }); });
  };

  const filas = watchlist.map(function (t) {
    const hist = (historial && historial[t]) || [];
    const ult = hist[hist.length - 1] || null;
    const ant = hist[hist.length - 2] || null;
    const a = analisis && analisis[t];
    const cual = a && a.cualitativa && typeof a.cualitativa.nota === "number" ? a.cualitativa.nota : null;
    const cuantRef = ult && ult.nota != null ? ult.nota : (a ? notaDe(a) : null);
    const media = cual != null && cuantRef != null ? Math.round((cual + cuantRef) / 2) : null;
    const dNota = ant && ult && ant.nota != null && ult.nota != null ? ult.nota - ant.nota : null;
    const dPrecio = ant && ult && ant.precio && ult.precio ? ult.precio / ant.precio - 1 : null;
    /*
     * Desde que entró en la lista, no desde la revisión anterior.
     *
     * Son dos preguntas distintas y las dos sirven: la de al lado dice qué ha
     * hecho esta semana, y esta dice si fijarse en ella sirvió de algo.
     */
    const entrada = hist[0] || null;
    const desdeEntrada = entrada && ult && entrada.precio && ult.precio && entrada !== ult
      ? ult.precio / entrada.precio - 1
      : null;
    const diasDentro = entrada ? Math.floor((Date.now() - new Date(entrada.fecha).getTime()) / 86400000) : null;
    return { t: t, ult: ult, ant: ant, senal: senalValue(ant, ult), a: a, cual: cual, cuantRef: cuantRef, media: media, dNota: dNota, dPrecio: dPrecio, hist: hist, entrada: entrada, desdeEntrada: desdeEntrada, diasDentro: diasDentro };
  });
  const filasVista = ordenSeg ? ordenarPor(filas, ordenSeg, {
    t: function (f) { return f.t; },
    cuant: function (f) { return f.cuantRef; },
    cual: function (f) { return f.cual; },
    media: function (f) { return f.media; },
    precio: function (f) { return f.ult ? f.ult.precio : null; },
    fecha: function (f) { return f.entrada ? new Date(f.entrada.fecha).getTime() : null; },
    senal: function (f) { return f.senal ? (f.senal.tipo === "compra" ? 2 : 1) : 0; },
    entrada: function (f) { return f.desdeEntrada; },
  }) : filas;
  const senales = filas.filter(function (f) { return f.senal && f.senal.tipo === "compra"; });

  /*
   * La cartera virtual, calculada una sola vez.
   *
   * La enseña la pantalla y la imprime el informe. Calculándola dos veces, el
   * día que cambie una de las dos el papel diría una cosa y la pantalla otra.
   */
  const cartera = (function () {
    const con = filas.filter(function (f) { return f.desdeEntrada != null; });
    if (!con.length) return null;
    return {
      cuantas: con.length,
      media: con.reduce(function (a, f) { return a + f.desdeEntrada; }, 0) / con.length,
      mejor: con.reduce(function (a, f) { return !a || f.desdeEntrada > a.desdeEntrada ? f : a; }, null),
      peor: con.reduce(function (a, f) { return !a || f.desdeEntrada < a.desdeEntrada ? f : a; }, null),
    };
  })();

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginBottom: 6 }}>
        <div>
          <h2 style={{ fontFamily: fontDisplay, fontSize: 20, margin: 0 }}>Seguimiento activo</h2>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: "4px 0 0" }}>
            Reanaliza tu watchlist, guarda el historial de nota y precio, y marca la señal value clásica: la nota sube mientras el precio baja. Clic en una fila abre su ficha. Cuesta ~6 consultas por empresa.
          </p>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <Boton onClick={actualizar} deshabilitado={actualizando || !watchlist.length}>
            {actualizando ? "Analizando " + progreso : "Actualizar seguimiento"}
          </Boton>
          {filas.length > 0 && (
            <Boton secundario onClick={function () { generarInformeSeguimiento(filasVista, cartera); }}>
              Imprimir / PDF
            </Boton>
          )}
        </div>
      </div>

      {/*
        La cartera virtual: qué habría pasado si se hubiera puesto lo mismo en
        cada una el día que entró.

        A partes iguales a propósito. Ponderar por lo que uno habría invertido
        sería inventarse una decisión que no se tomó, y entonces el número ya no
        dice si fijarse en ellas sirvió: dice si se habría acertado el tamaño.
      */}
      {(function () {
        if (!cartera) return null;
        const media = cartera.media, mejor = cartera.mejor, peor = cartera.peor;
        const conDato = { length: cartera.cuantas };
        const verde = media >= 0;
        return (
          <div style={{ background: verde ? C.verdeClaro : C.rojoClaro, border: "1.5px solid " + (verde ? C.verde : C.rojo), borderRadius: 6, padding: "12px 16px", margin: "10px 0", fontSize: 13 }}>
            <div style={{ fontFamily: fontData, fontSize: 10, letterSpacing: 1, color: verde ? C.verde : C.rojo, marginBottom: 6 }}>CARTERA VIRTUAL · DESDE QUE CADA UNA ENTRÓ</div>
            <div style={{ display: "flex", gap: 22, flexWrap: "wrap", alignItems: "baseline" }}>
              <span style={{ fontFamily: fontDisplay, fontSize: 26, fontWeight: 700, color: verde ? C.verde : C.rojo }}>
                {media >= 0 ? "+" : ""}{fmt.pct(media)}
              </span>
              <span style={{ color: C.tintaSuave }}>
                a partes iguales en {conDato.length} {conDato.length === 1 ? "empresa" : "empresas"}
              </span>
              {mejor && <span style={{ fontFamily: fontData, fontSize: 12 }}>mejor: <b>{mejor.t}</b> {mejor.desdeEntrada >= 0 ? "+" : ""}{fmt.pct(mejor.desdeEntrada)}</span>}
              {peor && peor !== mejor && <span style={{ fontFamily: fontData, fontSize: 12 }}>peor: <b>{peor.t}</b> {peor.desdeEntrada >= 0 ? "+" : ""}{fmt.pct(peor.desdeEntrada)}</span>}
            </div>
            <p style={{ fontSize: 11.5, color: C.tintaSuave, margin: "8px 0 0", lineHeight: 1.5 }}>
              No es tu cartera: son las que te quedaste mirando. Comparar las dos es lo que dice si
              fijarse en algo sirvió de algo.
            </p>
          </div>
        );
      })()}

      {senales.length > 0 && (
        <div style={{ background: C.verdeClaro, border: "1.5px solid " + C.verde, borderRadius: 6, padding: "10px 14px", margin: "10px 0", fontSize: 13, color: C.verde, fontWeight: 600 }}>
          {senales.length === 1 ? "1 señal value detectada: " : senales.length + " señales value detectadas: "}
          {senales.map(function (f) { return f.t; }).join(", ")} — merecen ficha completa en Análisis.
        </div>
      )}

      {watchlist.length ? (
        <div style={{ background: C.blanco, border: "1px solid " + C.linea, borderRadius: 6, overflow: "hidden", marginTop: 8 }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ borderBottom: "2px solid " + C.tinta, fontFamily: fontData, fontSize: 11, color: C.tintaSuave }}>
                  <Th id="t" orden={ordenSeg} alternar={alternarSeg} alineado="left">EMPRESA</Th>
                  <Th id="cuant" orden={ordenSeg} alternar={alternarSeg}>CUANT.</Th>
                  <Th id="cual" orden={ordenSeg} alternar={alternarSeg}>CUAL.</Th>
                  <Th id="media" orden={ordenSeg} alternar={alternarSeg}>GLOBAL</Th>
                  <Th id="precio" orden={ordenSeg} alternar={alternarSeg}>PRECIO ACTUAL</Th>
                  <Th id="fecha" orden={ordenSeg} alternar={alternarSeg}>FECHA ENTRADA</Th>
                  <Th id="entrada" orden={ordenSeg} alternar={alternarSeg}>RENT. VIRTUAL</Th>
                  <th style={{ padding: "0 9px 10px", textAlign: "right" }}>TENDENCIA</th>
                  <Th id="senal" orden={ordenSeg} alternar={alternarSeg}>SEÑAL</Th>
                  <th style={{ padding: "10px 12px" }}></th>
                </tr>
              </thead>
              <tbody>
                {filasVista.map(function (f) {
                  const dNota = f.dNota, dPrecio = f.dPrecio, a = f.a, cual = f.cual, media = f.media;
                  return (
                    <tr key={f.t} onClick={function () { abrirAnalisis(f.t); }}
                      style={{ cursor: "pointer", borderBottom: "1px dotted " + C.linea, background: f.senal && f.senal.tipo === "compra" ? C.verdeClaro : "transparent" }}>
                      <td style={{ padding: "9px 9px" }}><b style={{ fontFamily: fontData }}>{f.t}</b>{a && a.nombre ? <span style={{ color: C.tintaSuave, fontSize: 12 }}> {a.nombre}</span> : null}</td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData, whiteSpace: "nowrap" }}>
                        {f.ult && f.ult.nota != null ? (
                          <span>
                            {f.ant && f.ant.nota != null ? <span style={{ color: C.tintaSuave }}>{f.ant.nota} → </span> : null}
                            <b style={{ color: colorNota(f.ult.nota) }}>{f.ult.nota}</b>
                            {dNota != null && dNota !== 0 ? <span style={{ color: dNota > 0 ? C.verde : C.rojo, marginLeft: 4 }}>({dNota > 0 ? "+" : ""}{dNota})</span> : null}
                          </span>
                        ) : "—"}
                      </td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData, fontWeight: 700, color: colorNota(cual) }}>{cual == null ? "—" : cual}</td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData, fontWeight: 700, color: colorNota(media) }}>{media == null ? "—" : media}</td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData, whiteSpace: "nowrap" }}>
                        {f.ult && f.ult.precio ? (
                          <span>
                            {fmt.num(f.ult.precio)}
                            {dPrecio != null ? <span style={{ color: dPrecio < 0 ? C.rojo : C.verde, marginLeft: 4 }}>({dPrecio >= 0 ? "+" : ""}{fmt.pct(dPrecio)})</span> : null}
                          </span>
                        ) : "—"}
                      </td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData, fontSize: 11, color: C.tintaSuave, whiteSpace: "nowrap" }}>
                        {f.entrada ? new Date(f.entrada.fecha).toLocaleDateString("es-ES") : "sin entrada"}
                      </td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData }}>
                        {f.desdeEntrada == null ? (
                          <span style={{ color: C.tintaSuave, fontSize: 11 }}>
                            {f.entrada ? "entró hoy" : "—"}
                          </span>
                        ) : (
                          <span>
                            <b style={{ color: f.desdeEntrada >= 0 ? C.verde : C.rojo }}>
                              {f.desdeEntrada >= 0 ? "+" : ""}{fmt.pct(f.desdeEntrada)}
                            </b>
                            <span style={{ display: "block", fontSize: 10, color: C.tintaSuave }}>
                              {f.diasDentro} días
                            </span>
                          </span>
                        )}
                      </td>
                      <td style={{ padding: "9px 9px", textAlign: "right" }}>
                        {/* La forma de la nota a lo largo de las revisiones. Se abre
                            para ver los puntos con su fecha. */}
                        <button onClick={function (ev) { ev.stopPropagation(); abrirCerrar(f.t); }} title={f.hist.length + " revisiones"}
                          style={{ background: "none", border: "none", padding: 0, cursor: f.hist.length > 1 ? "pointer" : "default", display: "inline-flex", alignItems: "center", gap: 6 }}>
                          <Chispa valores={f.hist.map(function (h) { return h.nota; }).filter(function (n) { return n != null; })} />
                          {f.hist.length > 1 ? <span style={{ fontSize: 10, color: C.tintaSuave, fontFamily: fontData }}>{f.hist.length}</span> : null}
                        </button>
                      </td>
                      <td style={{ padding: "9px 9px", textAlign: "right", fontFamily: fontData, fontSize: 11, fontWeight: 700, color: f.senal ? f.senal.color : C.tintaSuave }}>
                        {f.senal ? f.senal.texto : "—"}
                      </td>
                      <td style={{ padding: "9px 9px", textAlign: "right" }}>
                        <button onClick={function (ev) { ev.stopPropagation(); quitar(f.t); }} style={{ background: "none", border: "none", color: C.rojo, cursor: "pointer", fontSize: 12 }}>quitar</button>
                      </td>
                    </tr>
                  );
                })}
                {/*
                  Los puntos de cada empresa abierta.

                  La nota y el precio en dos dibujos y no en uno con dos ejes:
                  dos escalas en el mismo sitio hacen que las líneas se crucen
                  donde no se cruza nada, y esa forma la pone el eje, no los
                  datos. Debajo, los extremos escritos, que es donde se lee el
                  cuánto.
                */}
                {filasVista.filter(function (f) { return abiertas.indexOf(f.t) !== -1 && f.hist.length > 1; }).map(function (f) {
                  const notas = f.hist.map(function (h) { return h.nota; }).filter(function (n) { return n != null; });
                  const precios = f.hist.map(function (h) { return h.precio; }).filter(function (x) { return x != null; });
                  const desde = new Date(f.hist[0].fecha).toLocaleDateString("es-ES");
                  const hasta = new Date(f.hist[f.hist.length - 1].fecha).toLocaleDateString("es-ES");
                  return (
                    <tr key={f.t + "-puntos"} style={{ background: C.papel }}>
                      <td colSpan="10" style={{ padding: "14px 18px" }}>
                        <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, marginBottom: 10 }}>
                          {f.t} · {f.hist.length} revisiones · del {desde} al {hasta}
                        </div>
                        <div style={{ display: "flex", gap: 28, flexWrap: "wrap" }}>
                          <div>
                            <div style={{ fontFamily: fontData, fontSize: 10, color: C.tintaSuave, marginBottom: 4 }}>NOTA</div>
                            <Chispa valores={notas} ancho={240} alto={54} color={C.verde} />
                            <div style={{ fontFamily: fontData, fontSize: 11, marginTop: 4 }}>
                              {notas.length ? Math.min.apply(null, notas) + " – " + Math.max.apply(null, notas) : "—"}
                            </div>
                          </div>
                          <div>
                            <div style={{ fontFamily: fontData, fontSize: 10, color: C.tintaSuave, marginBottom: 4 }}>PRECIO</div>
                            <Chispa valores={precios} ancho={240} alto={54} color={C.laton} />
                            <div style={{ fontFamily: fontData, fontSize: 11, marginTop: 4 }}>
                              {precios.length ? fmt.num(Math.min.apply(null, precios)) + " – " + fmt.num(Math.max.apply(null, precios)) : "—"}
                            </div>
                          </div>
                        </div>
                        <div style={{ marginTop: 12, fontFamily: fontData, fontSize: 11, color: C.tinta, display: "flex", gap: 14, flexWrap: "wrap" }}>
                          {f.hist.slice().reverse().map(function (h, i) {
                            return (
                              <span key={i} style={{ whiteSpace: "nowrap" }}>
                                {new Date(h.fecha).toLocaleDateString("es-ES")} · <b style={{ color: colorNota(h.nota) }}>{h.nota == null ? "—" : h.nota}</b> · {h.precio == null ? "—" : fmt.num(h.precio)}
                              </span>
                            );
                          })}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      ) : (
        <div style={{ background: C.blanco, border: "1px dashed " + C.linea, borderRadius: 6, padding: 36, textAlign: "center", marginTop: 8 }}>
          <p style={{ fontFamily: fontDisplay, fontSize: 16, margin: "0 0 8px" }}>Aún no sigues ninguna empresa</p>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: 0 }}>Analiza una empresa en la pestaña Análisis y pulsa «Añadir a seguimiento» en su ficha.</p>
        </div>
      )}

      <p style={{ fontSize: 11, color: C.tintaSuave, marginTop: 12, fontFamily: fontData }}>
        Delfos no tiene servidor, así que no puede avisarte solo: el ritual es abrir esta pestaña y pulsar «Actualizar» cada pocos días. La señal se calcula contra la revisión anterior. CUAL. sale del botón «Calcular con noticias» de cada ficha (con «—», aún no pedida) y GLOBAL es la media de ambas notas.
      </p>
    </div>
  );
}

// ---------- Detalle por empresas del sector (screener + cotizaciones) ----------
// El screener nuevo y el antiguo usan nombres de industria distintos: probamos en cascada
async function screenerFmp(qs, apiKey) {
  try {
    const d = await fmpFetch(FMP_BASE + "/stable/company-screener?" + qs + "&apikey=" + apiKey);
    if (Array.isArray(d) && d.length) return d;
  } catch (e) { /* probamos la API antigua */ }
  try {
    const d2 = await fmpFetch(FMP_BASE + "/api/v3/stock-screener?" + qs + "&apikey=" + apiKey);
    if (Array.isArray(d2) && d2.length) return d2;
  } catch (e2) { /* sin resultados */ }
  return [];
}

async function detalleSector(cfg, apiKey) {
  const q = cfg.consulta;
  const capMin = q.capMin || 5000000000;
  function qs(obj) {
    const p = [];
    if (obj.sector) p.push("sector=" + encodeURIComponent(obj.sector));
    if (obj.industry) p.push("industry=" + encodeURIComponent(obj.industry));
    p.push("marketCapMoreThan=" + capMin);
    p.push("isEtf=false");
    p.push("limit=30");
    return p.join("&");
  }
  const consultas = [];
  if (q.industry) {
    consultas.push({ industry: q.industry });
    (q.industriasAlt || []).forEach(function (i) { consultas.push({ industry: i }); });
  } else if (q.sector) {
    consultas.push({ sector: q.sector });
  } else if (!q.tickers) {
    consultas.push({});
  }
  let lista = [];
  for (let i = 0; i < consultas.length && !lista.length; i++) {
    lista = await screenerFmp(qs(consultas[i]), apiKey);
  }
  let empresas = (Array.isArray(lista) ? lista : [])
    .map(function (x) { return { ticker: x.symbol, nombre: x.companyName || x.symbol, cap: x.marketCap }; })
    .filter(function (x) { return x.ticker; })
    .sort(function (a, b) { return (b.cap || 0) - (a.cap || 0); })
    .slice(0, 14);
  // Red final: lista curada de valores del sector, consultados en directo
  if (!empresas.length && q.tickers) {
    empresas = q.tickers.slice(0, 14).map(function (t) { return { ticker: t, nombre: t, cap: 0 }; });
  }
  if (!empresas.length) throw new Error("El screener no ha devuelto empresas para este sector — puede no estar incluido en tu plan");
  const conDatos = [];
  for (let i = 0; i < empresas.length; i += 4) {
    const lote = empresas.slice(i, i + 4);
    const parc = await Promise.all(lote.map(function (e) {
      return cotizacionRadar(e.ticker, apiKey)
        .then(function (c) {
          const nombre = e.nombre && e.nombre !== e.ticker ? e.nombre : (c.nombre || e.ticker);
          return { ticker: e.ticker, nombre: nombre, dia: c.dia, drawdown: c.drawdown, precio: c.precio };
        })
        .catch(function () { return null; });
    }));
    parc.forEach(function (p) { if (p && p.drawdown != null) conDatos.push(p); });
    if (i + 4 < empresas.length) await new Promise(function (r) { setTimeout(r, 300); });
  }
  if (!conDatos.length) throw new Error("Sin cotizaciones para las empresas del sector");
  conDatos.sort(function (a, b) { return a.drawdown - b.drawdown; });
  return conDatos.slice(0, 10);
}

// Análisis con doble fuente, reutilizable desde cualquier pestaña
async function analizarDual(t, apiKey, roicKey) {
  let a = null;
  if (apiKey) {
    try { a = await analizarTicker(t, apiKey); }
    catch (e1) { if (!roicKey) throw e1; }
  }
  if (!a && roicKey) a = await analizarTickerRoic(t, roicKey);
  if (a && a.fuente !== "roic" && roicKey && a.limitaciones && a.limitaciones.length >= 3) {
    try { const b = await analizarTickerRoic(t, roicKey); if (b) a = b; } catch (e2) { /* parcial */ }
  }
  return a;
}

// ---------- Detector de empresas cíclicas ----------
const SECTORES_CICLICOS = ["Energy", "Basic Materials", "Consumer Cyclical"];
const INDUSTRIAS_CICLICAS = ["Airlines", "Semiconductors", "Gold", "Silver", "Copper", "Steel", "Aluminum", "Auto - Manufacturers", "Auto Manufacturers", "Oil & Gas", "Marine Shipping", "Chemicals", "Coal", "Paper", "Homebuilding", "Residential Construction", "Airports", "Travel"];

function detectarCiclo(epsValidos, epsTTM, precio, sector, industria) {
  const n = epsValidos.length;
  const perdidas = epsValidos.filter(function (v) { return v <= 0; }).length;
  const sectorC = SECTORES_CICLICOS.indexOf(sector) !== -1;
  const industriaC = !!(industria && INDUSTRIAS_CICLICAS.some(function (i) { return String(industria).indexOf(i) !== -1; }));
  // Pérdidas que ALTERNAN con beneficios = ciclo; pérdidas solo en la infancia (racha reciente toda positiva) = empresa madurando
  let rachaReciente = 0;
  while (rachaReciente < n && epsValidos[rachaReciente] > 0) rachaReciente++;
  const alternancia = epsValidos.slice(rachaReciente).some(function (v) { return v > 0; });
  const historialC = n >= 6 && perdidas >= 2 && alternancia;
  if (!sectorC && !industriaC && !historialC) return null;
  const motivo = industriaC ? "industria típicamente cíclica" : sectorC ? "sector típicamente cíclico" : "historial con varios años en pérdidas";
  let sobreciclo = null, perNormalizado = null;
  if (n >= 5) {
    const media = epsValidos.reduce(function (a, b) { return a + b; }, 0) / n;
    if (media > 0) {
      if (typeof epsTTM === "number" && epsTTM > 0) sobreciclo = epsTTM / media;
      if (typeof precio === "number" && precio > 0) perNormalizado = precio / media;
    }
  }
  return { esCiclica: true, motivo: motivo, perdidas: perdidas, n: n, sobreciclo: sobreciclo, perNormalizado: perNormalizado };
}

const SECTORES_VIVERO = ["Technology", "Healthcare", "Industrials", "Consumer Cyclical", "Consumer Defensive", "Financial Services", "Energy", "Basic Materials", "Communication Services", "Real Estate", "Utilities"];

/*
 * A quién le compra y a quién le vende una empresa, en bolsa.
 *
 * Se le pide al modelo con búsqueda web porque no hay ningún endpoint de datos
 * que dé relaciones entre empresas: FMP da cuentas, no clientes.
 *
 * Se le pide el ticker y el porqué en una línea. El porqué importa tanto como
 * el ticker: sin él no hay manera de saber si la relación es de verdad o se la
 * ha inventado, y hay que poder comprobarlo.
 */
async function cadenaDeValor(empresa, anthropicKey) {
  const prompt =
    "Busca en la web y dime qué empresas COTIZADAS forman la cadena de valor de " + empresa + ".\n\n" +
    "Quiero los cuatro papeles, no solo proveedores:\n" +
    "- proveedor: le vende componentes, materiales o servicios.\n" +
    "- cliente: le compra, y le va bien si a " + empresa + " le va bien.\n" +
    "- competidor: juega en el mismo terreno.\n" +
    "- palas: vende lo que hace falta para todo el sector, gane quien gane " +
    "(equipos, materiales críticos, infraestructura). Estos interesan especialmente.\n\n" +
    "Reglas:\n" +
    "- Solo empresas que coticen en bolsa, con su ticker. Nada de empresas privadas.\n" +
    "- Máximo 14, repartidas entre los papeles. Prefiere relación documentada.\n" +
    "- Si no encuentras relación documentada de alguna, no la pongas.\n" +
    "- Si te doy varias empresas, marca con \"sirveATodas\": true las que trabajen para todas.\n\n" +
    "Devuelve SOLO un JSON con esta forma, sin texto alrededor:\n" +
    '{"empresas":[{"ticker":"XXXX","nombre":"...","papel":"proveedor|cliente|competidor|palas",' +
    '"porque":"una línea diciendo qué papel tiene","fuente":"de dónde lo has sacado","sirveATodas":false}]}';

  const resp = await buscarConTope("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      // La búsqueda web gasta tokens antes de que empiece a escribir, así que
      // con poco presupuesto el JSON se corta a media llave.
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!resp.ok) {
    if (resp.status === 401) throw new Error("Clave de Anthropic no válida — revísala en Ajustes");
    throw new Error("No se ha podido consultar la cadena de valor");
  }
  const data = await resp.json();
  const texto = (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
  const j = sacarJSON(texto);
  const lista = (j && Array.isArray(j.empresas) ? j.empresas : [])
    .filter(function (e) { return e && e.ticker; })
    .map(function (e) {
      return {
        ticker: String(e.ticker).trim().toUpperCase(),
        nombre: e.nombre || e.ticker,
        papel: e.papel || "",
        porque: e.porque || "",
        fuente: e.fuente || "",
        sirveATodas: Boolean(e.sirveATodas),
      };
    });
  if (!lista.length) throw new Error("El modelo no ha devuelto ninguna empresa cotizada de esa cadena");
  return lista;
}

async function buscarPromesas(apiKey, sector, alProgreso) {
  const params = ["marketCapMoreThan=1000000000", "marketCapLowerThan=30000000000", "isEtf=false", "isActivelyTrading=true", "limit=120", "exchange=NYSE,NASDAQ"];
  if (sector) params.push("sector=" + encodeURIComponent(sector));
  if (alProgreso) alProgreso("barriendo el mercado…");
  const lista = await screenerFmp(params.join("&"), apiKey);
  let candidatos = (Array.isArray(lista) ? lista : [])
    .map(function (x) { return { ticker: x.symbol, nombre: x.companyName || x.symbol, cap: x.marketCap, sector: x.sector, industria: x.industry, vol: x.volume }; })
    .filter(function (x) { return x.ticker && x.cap; })
    .filter(function (x) { return !x.vol || x.vol >= 200000; });
  candidatos.sort(function (a, b) { return a.cap - b.cap; });
  candidatos = candidatos.slice(0, 60);
  if (!candidatos.length) throw new Error("El screener no ha devuelto candidatas — prueba sin filtro de sector");

  // Etapa 2: la firma de la inflexión en los beneficios, con sus contra-avisos
  const inflexion = [];
  for (let i = 0; i < candidatos.length; i += 5) {
    const lote = candidatos.slice(i, i + 5);
    if (alProgreso) alProgreso("filtrando beneficios " + Math.min(i + 5, candidatos.length) + "/" + candidatos.length);
    const res = await Promise.all(lote.map(function (cnd) {
      return fmpDual("income-statement?symbol=" + cnd.ticker + "&limit=3", "income-statement/" + cnd.ticker + "?limit=3", apiKey)
        .then(function (inc) {
          if (!inc || inc.length < 2) return null;
          function eps(x) { return elegir(x, ["epsDiluted", "epsdiluted", "eps"]); }
          const e0 = eps(inc[0]), e1 = eps(inc[1]);
          const v0 = inc[0].revenue, v1 = inc[1].revenue;
          if (!(typeof e0 === "number" && e0 > 0)) return null;
          const estreno = typeof e1 === "number" && e1 <= 0;
          const crecEPS = typeof e1 === "number" && e1 > 0 ? e0 / e1 - 1 : null;
          const crecVentas = typeof v0 === "number" && typeof v1 === "number" && v1 > 0 ? v0 / v1 - 1 : null;
          if (!estreno && !(crecEPS != null && crecEPS >= 0.2)) return null;
          if (crecVentas != null && crecVentas < 0.08) return null;

          // Contra-avisos: lo que el crecimiento puede estar escondiendo
          const avisos = [];
          const esCiclica = SECTORES_CICLICOS.indexOf(cnd.sector) !== -1 ||
            (cnd.industria && INDUSTRIAS_CICLICAS.some(function (ic) { return String(cnd.industria).indexOf(ic) !== -1; }));
          if (esCiclica) avisos.push({ icono: "⚠", clave: "cíclica", detalle: "Sector/industria cíclica: el crecimiento puede ser el pico del ciclo, no una inflexión duradera." });
          if (!estreno && crecEPS != null && crecEPS >= 0.8 && (crecVentas == null || crecVentas < 0.15)) {
            avisos.push({ icono: "🩹", clave: "rebote", detalle: "EPS disparado con ventas casi planas: huele a rebote contra un año hundido (saneamientos, extraordinarios), no a despegue." });
          } else if (!estreno && crecEPS != null && crecVentas != null && crecVentas < 0.15 && crecEPS >= crecVentas * 2.5) {
            avisos.push({ icono: "⚙", clave: "márgenes", detalle: "El beneficio crece mucho más que las ventas: expansión de márgenes, que tiene techo y en cíclicas se revierte." });
          }
          return { ticker: cnd.ticker, nombre: cnd.nombre, cap: cnd.cap, sector: cnd.sector, epsTTM: e0, estreno: estreno, crecEPS: crecEPS, crecVentas: crecVentas, avisos: avisos };
        })
        .catch(function () { return null; });
    }));
    res.forEach(function (r) { if (r) inflexion.push(r); });
    if (i + 5 < candidatos.length) await pausa(350);
  }
  if (!inflexion.length) throw new Error("Ninguna candidata pasa el filtro de inflexión hoy — el vivero también tiene temporadas");

  // Etapa 3: que el crecimiento además esté a buen precio
  const finales = [];
  for (let i = 0; i < inflexion.length; i += 5) {
    const lote = inflexion.slice(i, i + 5);
    if (alProgreso) alProgreso("valorando " + Math.min(i + 5, inflexion.length) + "/" + inflexion.length);
    const res = await Promise.all(lote.map(function (cnd) {
      return fmpDual("quote?symbol=" + cnd.ticker, "quote/" + cnd.ticker, apiKey)
        .then(function (q) {
          const x = (q && q[0]) || {};
          const precio = x.price;
          const per = typeof x.pe === "number" ? x.pe : (typeof precio === "number" && cnd.epsTTM > 0 ? precio / cnd.epsTTM : null);
          const crecRef = cnd.crecEPS != null ? Math.min(cnd.crecEPS, 1) : (cnd.crecVentas != null ? Math.min(cnd.crecVentas, 1) : null);
          const peg = per > 0 && crecRef > 0 ? per / (crecRef * 100) : null;
          const dd = typeof precio === "number" && typeof x.yearHigh === "number" && x.yearHigh > 0 ? precio / x.yearHigh - 1 : null;
          return { ...cnd, precio: precio, per: per, peg: peg, drawdown: dd };
        })
        .catch(function () { return cnd; });
    }));
    res.forEach(function (r) { finales.push(r); });
    if (i + 5 < inflexion.length) await pausa(350);
  }
  finales.sort(function (a, b) {
    const pa = a.peg != null ? a.peg : 99;
    const pb = b.peg != null ? b.peg : 99;
    if (pa !== pb) return pa - pb;
    return (b.crecVentas || 0) - (a.crecVentas || 0);
  });
  return finales.slice(0, 15);
}

// Barridos antiguos sin diagnóstico: al menos la cíclica se deduce del sector
function avisosRetro(cnd) {
  if (cnd.avisos) return cnd.avisos;
  const av = [];
  if (SECTORES_CICLICOS.indexOf(cnd.sector) !== -1) {
    av.push({ icono: "⚠", clave: "cíclica", detalle: "Sector cíclico (barrido antiguo: reescanea para el diagnóstico completo)." });
  }
  return av;
}

// Síntesis en estrellas: PEG + crecimiento + avisos + castigo del precio + nota
function estrellasVivero(cnd, nota) {
  let p = 0;
  if (cnd.peg == null) p += cnd.estreno ? 1 : 0.5;
  else if (cnd.peg <= 0.8) p += 2;
  else if (cnd.peg <= 1.2) p += 1.5;
  else if (cnd.peg <= 1.8) p += 1;
  else p += 0.5;
  if (cnd.crecVentas != null) {
    if (cnd.crecVentas >= 0.3) p += 1;
    else if (cnd.crecVentas >= 0.15) p += 0.5;
  }
  if (cnd.estreno) p += 0.5;
  if (cnd.drawdown != null && cnd.drawdown <= -0.15 && cnd.drawdown > -0.6) p += 0.5;
  (cnd.avisos || []).forEach(function (av) {
    if (av.clave === "cíclica" || av.clave === "rebote") p -= 1.5;
    else if (av.clave === "márgenes") p -= 0.75;
  });
  if (nota != null) {
    if (nota >= 70) p += 0.75;
    else if (nota >= 50) p += 0.25;
    else if (nota < 35) p -= 0.5;
  }
  let estrellas = 0;
  if (p >= 3.5) estrellas = 3;
  else if (p >= 2.25) estrellas = 2;
  else if (p >= 1.25) estrellas = 1;
  // Techo: con aviso de cíclica o rebote, las 3 estrellas quedan vetadas
  const grave = (cnd.avisos || []).some(function (av) { return av.clave === "cíclica" || av.clave === "rebote"; });
  if (grave && estrellas > 2) estrellas = 2;
  return estrellas;
}


/*
 * Buscar empresas por la cadena de valor de otra.
 *
 * Pestaña aparte del Vivero porque no buscan lo mismo ni encuentran lo mismo.
 * El Vivero está acotado a posta —EE. UU., de mil a treinta mil millones, con
 * inflexión de beneficios— y esto no tiene ninguno de esos filtros: por eso saca
 * empresas consolidadas que el otro deja fuera por construcción.
 *
 * El descubrimiento es temático; el juicio no. Salen de aquí y entran por el
 * mismo `analizarDual` y la misma nota que todo lo demás.
 */
function Cadena({ apiKey, roicKey, anthropicKey, analisis, setAnalisis, cadena, setCadena, setAviso, abrirAnalisis, diagnostico, watchlist, seguir }) {
  const [deQuien, setDeQuien] = useState("");
  const [buscando, setBuscando] = useState(false);
  const [calculando, setCalculando] = useState(false);
  const [progreso, setProgreso] = useState("");
  const [fallo, setFallo] = useState(null);
  const [ordenCad, alternarCad] = usarOrden(null);

  const buscar = async () => {
    const quien = deQuien.trim();
    apuntar("pulsado buscar cadena: " + JSON.stringify(quien));
    if (!quien) { apuntar("se para: no has escrito ninguna empresa"); setFallo("Escribe una empresa (o dos separadas por coma)."); return; }
    if (buscando) return;
    if (!anthropicKey) {
      /* Se dice y se queda: saltar a Ajustes desmonta esta pantalla y se lleva
         el mensaje con ella, y desde fuera parece que el botón no hace nada. */
      apuntar("se para: no hay clave de Anthropic guardada");
      setFallo("La cadena la busca el modelo de Anthropic, y esa clave la pone cada uno porque es de pago por uso. Guárdala en Ajustes y vuelve.");
      return;
    }
    setBuscando(true);
    try {
      apuntar("preguntando al modelo por la cadena de " + quien + "…");
      const lista = await cadenaDeValor(quien, anthropicKey);
      apuntar("el modelo ha contestado: " + lista.length + " empresas");
      setCadena({ fecha: new Date().toISOString(), de: quien, empresas: lista });
      setDeQuien("");
      setFallo(null);
    } catch (e) {
      const porque = (e && e.message) ? e.message : "sin mensaje";
      apuntar("NO se ha podido: " + porque);
      setFallo(porque);
    } finally {
      setBuscando(false);
    }
  };

  /* Las mismas notas que todo lo demás: de aquí no sale ninguna vara nueva. */
  const calcularNotas = async () => {
    if (calculando || !cadena || !cadena.empresas) return;
    setCalculando(true);
    const nuevo = { ...analisis };
    for (let i = 0; i < cadena.empresas.length; i++) {
      const t = cadena.empresas[i].ticker;
      if (nuevo[t]) continue;
      setProgreso(t + " (" + (i + 1) + "/" + cadena.empresas.length + ")");
      try { const a = await analizarDual(t, apiKey, roicKey); if (a) nuevo[t] = a; }
      catch (e) { apuntar("sin datos de " + t + ": " + (e && e.message ? e.message : "")); }
      await pausa(350);
    }
    setAnalisis(nuevo);
    setProgreso("");
    setCalculando(false);
  };

  const COLOR_PAPEL = { proveedor: C.verde, cliente: C.laton, competidor: C.tintaSuave, palas: C.rojo };

  const filas = (cadena && cadena.empresas ? cadena.empresas : []).map(function (e) {
    const a = analisis && analisis[e.ticker];
    return { ...e, a: a, nota: a ? notaDe(a) : null };
  });
  // Las palas primero y después las que sirven a todas: son las dos cosas que
  // se vienen a buscar aquí, y enterradas en la lista no se ven.
  const orden = { palas: 0, proveedor: 1, cliente: 2, competidor: 3 };
  filas.sort(function (x, y) {
    if (x.sirveATodas !== y.sirveATodas) return x.sirveATodas ? -1 : 1;
    return (orden[x.papel] == null ? 9 : orden[x.papel]) - (orden[y.papel] == null ? 9 : orden[y.papel]);
  });
  const filasVista = ordenarPor(filas, ordenCad, {
    ticker: function (f) { return f.ticker; },
    papel: function (f) { return orden[f.papel] == null ? 9 : orden[f.papel]; },
    per: function (f) { return f.a ? f.a.per : null; },
    nota: function (f) { return f.nota; },
  });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 10 }}>
        <div>
          <h2 style={{ fontFamily: fontDisplay, fontSize: 20, margin: 0 }}>Cadena de valor</h2>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: "4px 0 0", maxWidth: 640 }}>
            Quién le vende, quién le compra, quién compite y quién vende las palas — el que gana pase lo
            que pase. Sin los filtros del Vivero, así que salen empresas consolidadas que allí no caben.
            Dos empresas separadas por coma y se marcan las que sirven a las dos.
          </p>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <Campo valor={deQuien} onChange={setDeQuien} placeholder="Tesla, Nvidia" ancho={220} onEnter={buscar} />
          <Boton onClick={buscar} deshabilitado={buscando || calculando}>{buscando ? "Buscando…" : "Buscar cadena"}</Boton>
        </div>
      </div>

      {fallo && (
        <div style={{ background: C.rojoClaro, border: "1px solid " + C.rojo, borderRadius: 6, padding: "10px 14px", margin: "12px 0", fontSize: 13, color: C.tinta }}>
          <b>No se ha podido:</b> {fallo}
        </div>
      )}

      <CajaPasos setAviso={setAviso} encendido={diagnostico} />

      {cadena && cadena.empresas && cadena.empresas.length > 0 ? (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, margin: "10px 0 8px" }}>
            <span style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave }}>
              {"CADENA DE " + cadena.de.toUpperCase() + " · " + new Date(cadena.fecha).toLocaleString("es-ES") + " · " + cadena.empresas.length + " empresas"}
            </span>
            <Boton pequeno secundario onClick={calcularNotas} deshabilitado={calculando || buscando}>
              {calculando ? "Calculando " + progreso : "Calcular notas que falten"}
            </Boton>
          </div>

          {/* Lo que hay que saber antes de creérsela. */}
          <div style={{ background: C.latonClaro, border: "1px solid " + C.laton, borderRadius: 6, padding: "10px 14px", marginBottom: 10, fontSize: 12, lineHeight: 1.55 }}>
            <strong style={{ fontFamily: fontData, fontSize: 10, letterSpacing: 1, color: C.laton, display: "block", marginBottom: 4 }}>ESTA LISTA NO ES UN DATO</strong>
            La ha escrito un modelo buscando en la web, así que puede incluir relaciones que no existen:
            cada empresa trae el porqué y la fuente para que puedas comprobarlo. Y la búsqueda web
            encuentra el consenso —lo que ya se está contando—, que suele ser lo que ya ha subido.
            Lo que separa una idea de un titular son los números, no la lista.
          </div>

          <div style={{ background: C.blanco, border: "1px solid " + C.linea, borderRadius: 6, overflow: "hidden" }}>
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ borderBottom: "2px solid " + C.tinta, fontFamily: fontData, fontSize: 11, color: C.tintaSuave }}>
                    <Th id="ticker" orden={ordenCad} alternar={alternarCad} alineado="left">EMPRESA · CLIC PARA FICHA</Th>
                    <Th id="papel" orden={ordenCad} alternar={alternarCad} alineado="left">PAPEL</Th>
                    <Th id="per" orden={ordenCad} alternar={alternarCad}>PER</Th>
                    <Th id="nota" orden={ordenCad} alternar={alternarCad}>NOTA</Th>
                    <th style={{ padding: "10px 12px" }}></th>
                  </tr>
                </thead>
                <tbody>
                  {filasVista.map(function (f) {
                    const enSeguimiento = watchlist.indexOf(f.ticker) !== -1;
                    return (
                      <tr key={f.ticker} onClick={function () { abrirAnalisis(f.ticker); }}
                        style={{ cursor: "pointer", borderBottom: "1px dotted " + C.linea, background: f.sirveATodas ? C.verdeClaro : "transparent" }}>
                        <td style={{ padding: "9px 12px" }}>
                          <b style={{ fontFamily: fontData }}>{f.ticker}</b> <span style={{ color: C.tintaSuave }}>{f.nombre}</span>
                          {f.sirveATodas ? <span style={{ fontFamily: fontData, fontSize: 10, color: C.verde, fontWeight: 700 }}> · SIRVE A TODAS</span> : null}
                          {f.porque ? (
                            <div style={{ fontSize: 11, color: C.tintaSuave, lineHeight: 1.45, marginTop: 2, maxWidth: 460 }}>
                              {f.porque}{f.fuente ? <span style={{ fontFamily: fontData, fontSize: 10 }}> · {f.fuente}</span> : null}
                            </div>
                          ) : null}
                        </td>
                        <td style={{ padding: "9px 12px", fontFamily: fontData, fontSize: 11, color: COLOR_PAPEL[f.papel] || C.tintaSuave, fontWeight: 700 }}>
                          {f.papel || "—"}
                        </td>
                        <td style={{ padding: "9px 12px", textAlign: "right", fontFamily: fontData }}>{f.a ? fmt.num(f.a.per, 1) : "—"}</td>
                        <td style={{ padding: "9px 12px", textAlign: "right", fontFamily: fontData, fontWeight: 700, color: colorNota(f.nota) }}>{f.nota == null ? "—" : f.nota}</td>
                        <td style={{ padding: "9px 12px", textAlign: "right" }}>
                          <button onClick={function (ev) {
                            ev.stopPropagation();
                            if (enSeguimiento) return;
                            seguir(f.ticker, f.a);
                            setAviso(f.ticker + " añadida al seguimiento");
                          }} style={{ background: "none", border: "none", color: enSeguimiento ? C.tintaSuave : C.verde, cursor: enSeguimiento ? "default" : "pointer", fontSize: 12 }}>
                            {enSeguimiento ? "en seguimiento" : "seguir"}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          <p style={{ fontSize: 11.5, color: C.tintaSuave, lineHeight: 1.6, marginTop: 10 }}>
            Las palas y las que sirven a varias van primero: son las dos cosas que se vienen a buscar
            aquí. Quien depende de un solo cliente aguanta peor que quien le vende a todo el sector.
          </p>
        </div>
      ) : (
        <div style={{ background: C.blanco, border: "1px dashed " + C.linea, borderRadius: 6, padding: "30px 20px", textAlign: "center", marginTop: 10 }}>
          <p style={{ fontFamily: fontDisplay, fontSize: 17, margin: 0 }}>Quien vende las palas gana la fiebre del oro</p>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: "6px 0 0" }}>
            Escribe una empresa que lo esté petando y mira quién cobra por detrás.
          </p>
        </div>
      )}
    </div>
  );
}

function Vivero({ apiKey, roicKey, analisis, setAnalisis, vivero, setVivero, setAviso, irAAjustes, abrirAnalisis }) {
  const [buscando, setBuscando] = useState(false);
  const [progreso, setProgreso] = useState("");
  const [sector, setSector] = useState("");

  /*
   * Candidatas por cadena de valor: quién le vende a quién.
   *
   * El descubrimiento es temático, el juicio no. Salen de aquí y entran por el
   * mismo filtro que las del barrido: si ninguna pasa, la respuesta es que el
   * tema está caro, y eso también es información.
   */
  const [calculandoNotas, setCalculandoNotas] = useState(false);
  const [ordenViv, alternarViv] = usarOrden(null);

  const buscar = async () => {
    if (buscando) return;
    if (!apiKey) { setAviso("El Vivero necesita tu clave de FMP — guárdala en Ajustes"); irAAjustes(); return; }
    setBuscando(true);
    try {
      const candidatas = await buscarPromesas(apiKey, sector, setProgreso);
      setVivero({ fecha: new Date().toISOString(), sector: sector, candidatas: candidatas });
    } catch (e) { setAviso(e.message); }
    setProgreso("");
    setBuscando(false);
  };

  const calcularNotas = async () => {
    if (calculandoNotas || !vivero || !vivero.candidatas) return;
    setCalculandoNotas(true);
    const nuevoAnalisis = { ...analisis };
    for (let i = 0; i < vivero.candidatas.length; i++) {
      const t = vivero.candidatas[i].ticker;

// ---------- Líderes: fuerza relativa sostenida contra el S&P 500 ----------
function retornoEnDias(serie, dias) {
  if (!serie || serie.length < 10) return null;
  const fin = serie[serie.length - 1];
  const corte = fin.t - dias * 86400000;
  let ini = null;
  for (let i = serie.length - 1; i >= 0; i--) {
    if (serie[i].t <= corte) { ini = serie[i]; break; }
  }
  if (!ini) ini = serie[0];
  if (!ini.p || !fin.p) return null;
  return fin.p / ini.p - 1;
}

async function escanearLideres(apiKey, alProgreso) {
  if (alProgreso) alProgreso("eligiendo el universo…");
  const qs = "marketCapMoreThan=10000000000&isEtf=false&isActivelyTrading=true&limit=150&exchange=NYSE,NASDAQ";
  const lista = await screenerFmp(qs, apiKey);
  let uni = (Array.isArray(lista) ? lista : [])
    .map(function (x) { return { ticker: x.symbol, nombre: x.companyName || x.symbol, sector: x.sector, cap: x.marketCap }; })
    .filter(function (x) { return x.ticker; })
    .sort(function (a, b) { return (b.cap || 0) - (a.cap || 0); })
    .slice(0, 120);
  if (uni.length < 20) throw new Error("El screener no ha devuelto universo suficiente");

  if (alProgreso) alProgreso("midiendo el S&P 500…");
  const spy = await preciosHistoricosFmp("SPY", apiKey);
  const ref = { m1: retornoEnDias(spy, 30), m3: retornoEnDias(spy, 91), m6: retornoEnDias(spy, 182), a1: retornoEnDias(spy, 365) };
  if (ref.a1 == null) throw new Error("Sin histórico del S&P 500 para comparar");

  const filas = [];
  for (let i = 0; i < uni.length; i += 5) {
    const lote = uni.slice(i, i + 5);
    if (alProgreso) alProgreso("midiendo fuerza " + Math.min(i + 5, uni.length) + "/" + uni.length);
    const res = await Promise.all(lote.map(function (e) {
      return preciosHistoricosFmp(e.ticker, apiKey)
        .then(function (serie) {
          const r = { m1: retornoEnDias(serie, 30), m3: retornoEnDias(serie, 91), m6: retornoEnDias(serie, 182), a1: retornoEnDias(serie, 365) };
          return {
            ticker: e.ticker, nombre: e.nombre, sector: e.sector,
            rel_m1: r.m1 != null && ref.m1 != null ? r.m1 - ref.m1 : null,
            rel_m3: r.m3 != null && ref.m3 != null ? r.m3 - ref.m3 : null,
            rel_m6: r.m6 != null && ref.m6 != null ? r.m6 - ref.m6 : null,
            rel_a1: r.a1 != null && ref.a1 != null ? r.a1 - ref.a1 : null,
            ret12: r.a1,
          };
        })
        .catch(function () { return null; });
    }));
    res.forEach(function (f) { if (f) filas.push(f); });
    if (i + 5 < uni.length) await pausa(350);
  }
  if (filas.length < 20) throw new Error("No se han podido medir suficientes valores — reintenta en un rato");

  // Percentiles 0-99 por horizonte dentro del universo medido
  ["m1", "m3", "m6", "a1"].forEach(function (h) {
    const vals = filas.map(function (f) { return f["rel_" + h]; }).filter(function (v) { return v != null; }).sort(function (a, b) { return a - b; });
    filas.forEach(function (f) {
      const v = f["rel_" + h];
      if (v == null) { f["rs_" + h] = null; return; }
      let k = 0;
      while (k < vals.length && vals[k] <= v) k++;
      f["rs_" + h] = Math.round((k / vals.length) * 99);
    });
  });

  // Fórmula «tendencia sólida»: largo plazo manda (6M 40 % · 1A 40 % · 3M 20 %)
  filas.forEach(function (f) {
    let suma = 0, peso = 0;
    if (f.rs_m3 != null) { suma += f.rs_m3 * 0.2; peso += 0.2; }
    if (f.rs_m6 != null) { suma += f.rs_m6 * 0.4; peso += 0.4; }
    if (f.rs_a1 != null) { suma += f.rs_a1 * 0.4; peso += 0.4; }
    f.rs = peso ? Math.round(suma / peso) : null;
  });
  filas.sort(function (a, b) { return (b.rs == null ? -1 : b.rs) - (a.rs == null ? -1 : a.rs); });
  return filas.slice(0, 30);
}

// ---------- Ordenación por columnas: clic en la cabecera ----------
function usarOrden(defecto) {
  const [orden, setOrden] = useState(defecto);
  const alternar = function (campo) {
    setOrden(function (o) { return o && o.campo === campo ? { campo: campo, asc: !o.asc } : { campo: campo, asc: false }; });
  };
  return [orden, alternar];
}

function ordenarPor(filas, orden, extractores) {
  if (!orden || !extractores[orden.campo]) return filas;
  const ex = extractores[orden.campo];
  return filas.slice().sort(function (a, b) {
    const va = ex(a), vb = ex(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === "string" || typeof vb === "string") {
      return orden.asc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    }
    return orden.asc ? va - vb : vb - va;
  });
}

function Th({ id, orden, alternar, alineado, children }) {
  const activo = orden && orden.campo === id;
  return (
    <th
      onClick={function () { alternar(id); }}
      title="Clic para ordenar por esta columna"
      style={{ textAlign: alineado || "right", padding: "10px 12px", letterSpacing: 1, cursor: "pointer", userSelect: "none", color: activo ? C.tinta : undefined, whiteSpace: "nowrap" }}
    >
      {children}{activo ? (orden.asc ? " ▲" : " ▼") : ""}
    </th>
  );
}

async function intentoFmp(rutas, apiKey) {
  for (let i = 0; i < rutas.length; i++) {
    try {
      const sep = rutas[i].indexOf("?") !== -1 ? "&" : "?";
      const d = await fmpFetch(FMP_BASE + rutas[i] + sep + "apikey=" + apiKey);
      if (d && (Array.isArray(d) ? d.length : Object.keys(d).length)) return d;
    } catch (e) { /* probamos la siguiente ruta */ }
  }
  return null;
}

async function consensoWallStreet(ticker, apiKey, precio, epsTTM) {
  const t = ticker.trim().toUpperCase();
  const [obj, grados, est] = await Promise.all([
    intentoFmp(["/stable/price-target-consensus?symbol=" + t, "/api/v4/price-target-consensus?symbol=" + t], apiKey),
    intentoFmp(["/stable/grades-consensus?symbol=" + t, "/api/v4/upgrades-downgrades-consensus?symbol=" + t, "/api/v3/analyst-stock-recommendations/" + t + "?limit=1"], apiKey),
    intentoFmp(["/stable/analyst-estimates?symbol=" + t + "&period=annual&limit=6", "/api/v3/analyst-estimates/" + t + "?limit=6"], apiKey),
  ]);
  if (!obj && !grados && !est) throw new Error("Tu plan de FMP no devuelve datos de consenso para este ticker");

  const o = obj && (Array.isArray(obj) ? obj[0] : obj);
  const objetivo = o ? {
    consenso: elegir(o, ["targetConsensus", "priceTargetConsensus", "targetMedian"]),
    alto: elegir(o, ["targetHigh"]),
    bajo: elegir(o, ["targetLow"]),
  } : null;
  const potencial = objetivo && objetivo.consenso && precio ? objetivo.consenso / precio - 1 : null;

  let recomendacion = null;
  if (grados) {
    const g = Array.isArray(grados) ? grados[0] : grados;
    if (g) {
      const sb = elegir(g, ["strongBuy", "analystRatingsStrongBuy"]) || 0;
      const b = elegir(g, ["buy", "analystRatingsbuy", "analystRatingsBuy"]) || 0;
      const h = elegir(g, ["hold", "analystRatingsHold"]) || 0;
      const s = elegir(g, ["sell", "analystRatingsSell"]) || 0;
      const ss = elegir(g, ["strongSell", "analystRatingsStrongSell"]) || 0;
      const total = sb + b + h + s + ss;
      let resumen = elegir(g, ["consensus"]);
      if (!resumen && total) {
        const puntua = (sb * 2 + b - s - ss * 2) / total;
        resumen = puntua >= 1 ? "Compra fuerte" : puntua >= 0.4 ? "Compra" : puntua > -0.4 ? "Mantener" : "Vender";
      }
      if (total || resumen) {
        recomendacion = {
          resumen: resumen || "—",
          total: total,
          desglose: total ? sb + " compra fuerte · " + b + " compra · " + h + " mantener · " + (s + ss) + " venta" : "",
        };
      }
    }
  }

  let forward = null;
  if (est && Array.isArray(est)) {
    const hoy = new Date().toISOString().slice(0, 10);
    const futuras = est
      .filter(function (x) { return x && x.date && String(x.date).slice(0, 10) >= hoy; })
      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    const prox = futuras[0];
    if (prox) {
      const epsFut = elegir(prox, ["epsAvg", "estimatedEpsAvg", "estimatedEps"]);
      if (typeof epsFut === "number" && epsFut > 0) {
        const perFwd = precio ? precio / epsFut : null;
        const crec = typeof epsTTM === "number" && epsTTM > 0 ? epsFut / epsTTM - 1 : null;
        forward = {
          anio: String(prox.date).slice(0, 4),
          epsFut: epsFut,
          perFwd: perFwd,
          crecEsperado: crec,
          pegFwd: perFwd != null && crec > 0 ? perFwd / (crec * 100) : null,
        };
      }
    }
  }

  return { fecha: new Date().toISOString(), objetivo: objetivo, potencial: potencial, recomendacion: recomendacion, forward: forward };
}

/*
 * Una línea con la forma de una serie. Sin ejes ni números: dice hacia dónde va,
 * y el cuánto se lee en los extremos, que sí van escritos.
 *
 * Con un solo punto no se dibuja nada: una raya plana sugeriría que algo se ha
 * mantenido, y lo que pasa es que todavía no hay con qué comparar.
 */
function Chispa({ valores, ancho, alto, color }) {
  const w = ancho || 90;
  const h = alto || 26;
  if (!valores || valores.length < 2) return <span style={{ color: C.tintaSuave, fontSize: 11 }}>—</span>;
  const min = Math.min.apply(null, valores);
  const max = Math.max.apply(null, valores);
  const rango = max - min || 1;
  // Un margen arriba y abajo para que una línea plana no se pegue al borde.
  const m = 3;
  const punto = function (v, i) {
    const x = (i / (valores.length - 1)) * w;
    const y = h - m - ((v - min) / rango) * (h - m * 2);
    return [x, y];
  };
  const d = valores.map(function (v, i) {
    const xy = punto(v, i);
    return (i ? "L" : "M") + xy[0].toFixed(1) + " " + xy[1].toFixed(1);
  }).join(" ");
  const fin = punto(valores[valores.length - 1], valores.length - 1);
  const tono = color || C.verde;
  return (
    <svg width={w} height={h} style={{ display: "block", overflow: "visible" }} aria-hidden="true">
      <path d={d} fill="none" stroke={tono} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={fin[0]} cy={fin[1]} r="2.5" fill={tono} />
    </svg>
  );
}

/*
 * Qué ha hecho la aplicación, paso a paso y con un botón de copiar.
 *
 * Cualquier pantalla que haga algo que pueda fallar debería ponerla: lo que
 * hace falta para arreglar un fallo es poder leerlo, no suponerlo.
 */
function CajaPasos({ setAviso, encendido }) {
  const [pasos, setPasos] = useState([]);
  useEffect(function () {
    const oir = function (lista) { setPasos(lista); };
    oyentes.add(oir);
    setPasos(BITACORA.slice());
    return function () { oyentes.delete(oir); };
  }, []);
  if (!encendido || !pasos.length) return null;
  return (
    <div style={{ background: C.papel, border: "1px solid " + C.linea, borderRadius: 6, padding: "10px 14px", marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 6 }}>
        <b style={{ fontFamily: fontData, fontSize: 11, letterSpacing: 1, color: C.tintaSuave }}>QUÉ HA PASADO</b>
        <Boton pequeno secundario onClick={function () {
          try { navigator.clipboard.writeText(pasos.join(String.fromCharCode(10))); setAviso("Copiado"); }
          catch (e) { setAviso("No se ha podido copiar"); }
        }}>Copiar</Boton>
      </div>
      <pre style={{ fontFamily: fontData, fontSize: 11, lineHeight: 1.6, margin: 0, whiteSpace: "pre-wrap", color: C.tinta }}>{pasos.join(String.fromCharCode(10))}</pre>
    </div>
  );
}

function App() {
  const [pestana, setPestana] = useState("briefing");
  // Las claves de FMP y ROIC las pone el servidor. Aquí basta un valor
  // simbólico para que el resto del código siga su curso.
  const [apiKey, setApiKey] = useState(CLAVE_SERVIDOR);
  const [roicKey, setRoicKey] = useState(CLAVE_SERVIDOR);
  const [roicProxy, setRoicProxy] = useState("");
  const [anthropicKey, setAnthropicKey] = useState("");
  const [posiciones, setPosiciones] = useState([]);
  const [watchlist, setWatchlist] = useState([]);
  const [analisis, setAnalisis] = useState({});
  /* Si lo publicado ya no es lo que está corriendo en esta pestaña. */
  const [versionVieja, setVersionVieja] = useState(false);
  const [cadena, setCadena] = useState(null);
  /* Si se enseñan los pasos de lo que hace la aplicación. Apagado: solo hace
     falta cuando algo va mal, y el resto del tiempo estorba. */
  const [diagnostico, setDiagnostico] = useState(false);
  const [briefing, setBriefing] = useState(null);
  const [briefingFecha, setBriefingFecha] = useState(null);
  const [radar, setRadar] = useState(null);
  const [historial, setHistorial] = useState({});
  const [tickerPendiente, setTickerPendiente] = useState(null);
  const [vivero, setVivero] = useState(null);
  const [lideres, setLideres] = useState(null);
  const [cargado, setCargado] = useState(false);
  const [aviso, setAviso] = useState(null);

  /* Si lo de esta pestaña está puesto en el servidor. */
  const [sincronizado, setSincronizado] = useState(null);

  /*
   * Hasta que no se ha leído el servidor, no se escribe en él.
   *
   * Y el contador de cambios dice si se ha tocado algo mientras llegaba la
   * lectura. En referencia y no en estado porque solo se consulta: no pinta
   * nada en pantalla y no tiene que provocar un repintado.
   */
  const [miradoElServidor, setMiradoElServidor] = useState(false);
  const cambios = useRef(0);

  /* Poner en pantalla una copia de los datos, venga de donde venga. */
  const volcar = (d) => {
    if (!d) return;
    setApiKey(CLAVE_SERVIDOR);
    setRoicKey(CLAVE_SERVIDOR);
    setRoicProxy(d.roicProxy || "");
    setAnthropicKey(d.anthropicKey || "");
    setPosiciones(d.posiciones || []);
    setWatchlist(d.watchlist || []);
    setAnalisis(d.analisis || {});
    setDiagnostico(Boolean(d.diagnostico));
    setCadena(d.cadena || null);
    setBriefing(d.briefing || null);
    setBriefingFecha(d.briefingFecha || null);
    setRadar(d.radar || null);
    setHistorial(d.historial || {});
    setVivero(d.vivero || null);
    setLideres(d.lideres || null);
  };

  /*
   * Al abrir: lo de aquí primero y lo del servidor después.
   *
   * Lo local se pinta sin esperar a nadie, así que la aplicación arranca igual
   * de rápido y funciona aunque no haya red. Cuando llega lo del servidor, si
   * trae algo, manda: es la copia que han tocado los demás sitios.
   *
   * Y si el servidor está vacío y aquí hay algo, se sube. Es la primera vez de
   * cada quien, y sin eso al estrenar esto se habría quedado todo el mundo con
   * la pantalla en blanco creyendo que había perdido sus datos.
   */
  useEffect(() => {
    volcar(almacen.leer());
    setCargado(true);

    let viva = true;
    (async () => {
      /*
       * Preguntar hasta que conteste, cada vez con más calma.
       *
       * Mientras no contesta no se escribe nada: subir a ciegas podría machacar
       * una copia más nueva hecha en otro ordenador. Pero rendirse a los tres
       * intentos dejaba la sesión entera guardando solo aquí hasta recargar, y
       * un corte de medio minuto no puede costar una tarde de trabajo.
       */
      let remoto;
      let espera = 2000;
      for (;;) {
        remoto = await almacen.leerDelServidor();
        if (remoto !== undefined || !viva) break;
        setSincronizado(false);
        await new Promise(function (seguir) { setTimeout(seguir, espera); });
        if (espera < 30000) espera = Math.min(30000, espera * 2);
      }
      if (!viva) return;

      /*
       * Lo del servidor manda, salvo que se haya tocado algo mientras llegaba.
       *
       * El efecto de guardar salta una vez al cargar; si ha saltado más veces
       * es que se ha escrito o pulsado algo, y volcar encima lo del servidor
       * borraría delante de los ojos lo que se acaba de hacer.
       */
      if (remoto && cambios.current <= 1) volcar(remoto);

      /* Y a partir de aquí ya se puede escribir. La primera subida de quien
         estrena esto la hace el propio efecto de guardar en cuanto ve esta
         bandera: no hace falta un camino aparte que mantener. */
      setMiradoElServidor(true);
    })();
    return () => { viva = false; };
  }, []);

  useEffect(() => {
    if (!cargado) return;
    cambios.current += 1;
    const todo = { apiKey, roicKey, roicProxy, anthropicKey, posiciones, watchlist, analisis, briefing, briefingFecha, radar, historial, vivero, lideres, diagnostico, cadena };

    const ok = almacen.guardar(todo);
    if (!ok) setAviso("No se han podido guardar los datos en este navegador");

    if (!miradoElServidor) return;

    /*
     * Al servidor, con dos segundos de espera.
     *
     * Este efecto salta con cada tecla y cada casilla. Mandándolo todo cada vez
     * serían cientos de escrituras por sesión para guardar lo mismo: se espera a
     * que pare la mano y se manda una.
     */
    const reloj = setTimeout(function () {
      almacen.guardarEnServidor(todo).then(
        function () { setSincronizado(true); },
        function (e) {
          setSincronizado(false);
          // El motivo solo cuando dice algo que se pueda arreglar —como que ya
          // no cabe—; la red que falla un momento ya la cuenta el indicador.
          if (e && /ocupan/.test(e.message || "")) setAviso(e.message);
        },
      );
    }, 2000);
    return function () { clearTimeout(reloj); };
  }, [apiKey, roicKey, roicProxy, anthropicKey, posiciones, watchlist, analisis, briefing, briefingFecha, radar, historial, vivero, lideres, diagnostico, cadena, cargado, miradoElServidor]);

  /*
   * ¿Sigue esta pestaña sirviendo lo que hay publicado?
   *
   * Se apunta la versión al abrir y se vuelve a mirar cada vez que se vuelve a
   * la pestaña. Si no coincide, esta página es más vieja que lo publicado y lo
   * que se está viendo ya no es lo que hay.
   */
  useEffect(() => {
    let viva = true;
    let alAbrir = null;

    const mirar = async () => {
      try {
        const r = await fetch("/api/version", { cache: "no-store" });
        if (!r.ok) return;
        const d = await r.json();
        if (!viva || !d || !d.commit) return;
        if (alAbrir === null) { alAbrir = d.commit; return; }
        if (d.commit !== alAbrir) setVersionVieja(true);
      } catch (e) { /* sin red, ni se avisa ni se estorba */ }
    };

    mirar();
    const alVolver = () => { if (document.visibilityState === "visible") mirar(); };
    document.addEventListener("visibilitychange", alVolver);
    const cada = setInterval(mirar, 10 * 60 * 1000);
    return () => { viva = false; document.removeEventListener("visibilitychange", alVolver); clearInterval(cada); };
  }, []);

  useEffect(() => {
    if (aviso) { const t = setTimeout(() => setAviso(null), 6500); return () => clearTimeout(t); }
  }, [aviso]);

  useEffect(() => { fijarProxyRoic(roicProxy); }, [roicProxy]);

  /*
   * Entrar en seguimiento deja apuntado el punto de partida.
   *
   * Sin esto la cuenta empezaba en la primera actualización, que puede ser
   * semanas después: la cartera virtual diría que no ha pasado nada justo en el
   * tramo en que pasó.
   *
   * Si ya tiene historia no se toca: volver a añadir algo no puede borrar de
   * dónde venía.
   */
  const seguir = (ticker, ficha) => {
    if (!ticker || watchlist.indexOf(ticker) !== -1) return;
    setWatchlist(watchlist.concat([ticker]));
    const a = ficha || analisis[ticker];
    if (!a || !a.precio) return;
    setHistorial(function (h) {
      const ya = (h && h[ticker]) || [];
      if (ya.length) return h;
      const n = { ...(h || {}) };
      n[ticker] = [{ fecha: new Date().toISOString(), nota: notaDe(a), precio: a.precio, entrada: true }];
      return n;
    });
  };

  const pestanas = [["briefing", "Briefing"], ["analisis", "Análisis"], ["cartera", "Cartera"], ["seguimiento", "Seguimiento"], ["radar", "Radar"], ["vivero", "Vivero"], ["cadena", "Cadena"], ["lideres", "Líderes"], ["ajustes", "Ajustes"]];

  return (
    <div style={{ minHeight: "100vh", background: C.papel, color: C.tinta, fontFamily: fontBody }}>
      <header style={{ borderBottom: `2px solid ${C.tinta}`, padding: "20px 20px 0", maxWidth: 1080, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8 }}>
          <h1 style={{ fontFamily: fontDisplay, fontSize: 26, margin: 0, fontWeight: 600 }}>
            Delfos 2000
            <span style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, marginLeft: 12, letterSpacing: 1 }}>ANÁLISIS VALUE DIARIO</span>
          </h1>
          <span style={{ fontFamily: fontData, fontSize: 12, color: C.tintaSuave, display: "flex", alignItems: "center", gap: 14 }}>
            {/* Que se vea de un vistazo si lo de uno está a salvo fuera de este
                ordenador. Mientras no se sabe, nada: un aviso que parpadea cada
                vez que se abre se acaba sin mirar. */}
            {sincronizado !== null && (
              <span
                title={sincronizado
                  ? "Tus datos están guardados en el servidor de Delfos: los verás igual desde otro ordenador."
                  : "No se ha podido hablar con el servidor. Tus datos están guardados en este navegador y se subirán en cuanto vuelva."}
                style={{ display: "flex", alignItems: "center", gap: 5, letterSpacing: 1, color: sincronizado ? C.verde : C.laton }}
              >
                <span style={{ width: 7, height: 7, borderRadius: "50%", background: sincronizado ? C.verde : C.laton }} />
                {sincronizado ? "EN EL SERVIDOR" : "SOLO AQUÍ"}
              </span>
            )}
            {new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" })}
            <a href="/api/logout" style={{ color: C.tintaSuave, textDecoration: "none", letterSpacing: 1 }}>SALIR</a>
          </span>
        </div>
        <nav style={{ display: "flex", gap: 4, marginTop: 14 }}>
          {pestanas.map(([id, nombre]) => (
            <button key={id} onClick={() => setPestana(id)} style={{
              background: pestana === id ? C.tinta : "transparent", color: pestana === id ? C.papel : C.tintaSuave,
              border: "none", borderRadius: "6px 6px 0 0", padding: "8px 16px",
              fontFamily: fontBody, fontSize: 14, fontWeight: 600, cursor: "pointer",
            }}>{nombre}</button>
          ))}
        </nav>
      </header>

      {aviso && (
        <div style={{ position: "fixed", top: 14, left: "50%", transform: "translateX(-50%)", zIndex: 100, maxWidth: "92%", width: 560 }}>
          <div style={{ background: C.rojoClaro, border: "1.5px solid " + C.rojo, borderRadius: 6, padding: "10px 14px", fontSize: 13, color: C.rojo, boxShadow: "0 6px 18px rgba(0,0,0,.2)", textAlign: "center" }}>{aviso}</div>
        </div>
      )}

      {/* Esta pestaña se ha quedado vieja. No se recarga sola: quien está a
          medias de escribir algo no quiere que le quiten la página de debajo. */}
      {versionVieja && (
        <div style={{ background: C.latonClaro, borderBottom: "1.5px solid " + C.laton, padding: "10px 20px", fontSize: 13, display: "flex", gap: 12, alignItems: "center", justifyContent: "center", flexWrap: "wrap" }}>
          <span>Hay una versión más nueva publicada. Esta pestaña sigue con la anterior.</span>

      <main style={{ maxWidth: 1080, margin: "0 auto", padding: "24px 20px 60px" }}>
        {pestana === "briefing" && (

            briefing={briefing} briefingFecha={briefingFecha} setBriefing={setBriefing} setBriefingFecha={setBriefingFecha}

        {pestana === "analisis" && (
          <Analisis seguir={seguir} diagnostico={diagnostico} apiKey={apiKey} roicKey={roicKey} tickerPendiente={tickerPendiente} setTickerPendiente={setTickerPendiente} anthropicKey={anthropicKey} analisis={analisis} setAnalisis={setAnalisis} watchlist={watchlist}
            setWatchlist={setWatchlist} setAviso={setAviso} irAAjustes={() => setPestana("ajustes")} />

        {pestana === "cartera" && (
          <Cartera apiKey={apiKey} posiciones={posiciones} setPosiciones={setPosiciones} watchlist={watchlist}
            setWatchlist={setWatchlist} setAviso={setAviso} />

        {pestana === "seguimiento" && (
          <Seguimiento abrirAnalisis={(t) => { setTickerPendiente(t); setPestana("analisis"); }} apiKey={apiKey} roicKey={roicKey} watchlist={watchlist} setWatchlist={setWatchlist} analisis={analisis} setAnalisis={setAnalisis} historial={historial} setHistorial={setHistorial} setAviso={setAviso} irAAjustes={() => setPestana("ajustes")} />

        {pestana === "radar" && (
          <Radar apiKey={apiKey} roicKey={roicKey} analisis={analisis} setAnalisis={setAnalisis} abrirAnalisis={(t) => { setTickerPendiente(t); setPestana("analisis"); }} anthropicKey={anthropicKey} radar={radar} setRadar={setRadar} setAviso={setAviso} irAAjustes={() => setPestana("ajustes")} />
        )}
        {pestana === "vivero" && (
          <Vivero diagnostico={diagnostico} apiKey={apiKey} roicKey={roicKey} anthropicKey={anthropicKey} analisis={analisis} setAnalisis={setAnalisis} vivero={vivero} setVivero={setVivero} setAviso={setAviso} irAAjustes={() => setPestana("ajustes")} abrirAnalisis={(t) => { setTickerPendiente(t); setPestana("analisis"); }} />
        )}
        {pestana === "cadena" && (
          <Cadena diagnostico={diagnostico} apiKey={apiKey} roicKey={roicKey} anthropicKey={anthropicKey}
            analisis={analisis} setAnalisis={setAnalisis} cadena={cadena} setCadena={setCadena}
            watchlist={watchlist} seguir={seguir} setAviso={setAviso}
            abrirAnalisis={(t) => { setTickerPendiente(t); setPestana("analisis"); }} />
        )}
        {pestana === "lideres" && (
          <Lideres apiKey={apiKey} lideres={lideres} setLideres={setLideres} setAviso={setAviso} irAAjustes={() => setPestana("ajustes")} abrirAnalisis={(t) => { setTickerPendiente(t); setPestana("analisis"); }} />
        )}
        {pestana === "ajustes" && <Ajustes diagnostico={diagnostico} setDiagnostico={setDiagnostico} apiKey={apiKey} setApiKey={setApiKey} roicKey={roicKey} setRoicKey={setRoicKey} roicProxy={roicProxy} setRoicProxy={setRoicProxy} anthropicKey={anthropicKey} setAnthropicKey={setAnthropicKey} />}
      </main>

      <footer style={{ borderTop: `1px solid ${C.linea}`, padding: "14px 20px", maxWidth: 1080, margin: "0 auto", fontSize: 11, color: C.tintaSuave, fontFamily: fontData }}>
        Herramienta de análisis personal. No constituye asesoramiento financiero. Metodología: Lynch (múltiplos ajustados al crecimiento), Buffett y Munger (calidad del negocio) y Graham (solvencia). Tus datos se guardan en tu cuenta del servidor de Delfos.
      </footer>
    </div>
  );
}
