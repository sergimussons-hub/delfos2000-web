function Briefing({ anthropicKey, posiciones, watchlist, analisis, briefing, briefingFecha, setBriefing, setBriefingFecha, setAviso, irAAjustes }) {
  const [generando, setGenerando] = useState(false);
  const generar = async () => {
    if (!anthropicKey) { setAviso("Para el briefing necesitas una clave de API de Anthropic — guárdala en Ajustes"); irAAjustes(); return; }
    setGenerando(true);
    try {
      const texto = await generarBriefing(anthropicKey, posiciones, watchlist, analisis);
      setBriefing(texto);
      setBriefingFecha(new Date().toISOString());
    } catch (e) { setAviso(e.message); }
    setGenerando(false);
  };
  const esDeHoy = briefingFecha && new Date(briefingFecha).toDateString() === new Date().toDateString();
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
        <div>
          <h2 style={{ fontFamily: fontDisplay, fontSize: 20, margin: 0 }}>Briefing matinal</h2>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: "4px 0 0" }}>
            Noticias, geopolítica, regulación y tendencias cruzadas con tu universo de inversión ({posiciones.length} posiciones, {watchlist.length} en seguimiento).
          </p>
        </div>
        <Boton onClick={generar} deshabilitado={generando}>
          {generando ? "Leyendo la prensa…" : esDeHoy ? "Actualizar briefing" : "Generar briefing de hoy"}
        </Boton>
      </div>
      {briefing ? (
        <div style={{ background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 6, padding: "20px 24px" }}>
          <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, marginBottom: 8 }}>
            {esDeHoy ? "EDICIÓN DE HOY" : "ÚLTIMA EDICIÓN"} · {briefingFecha ? new Date(briefingFecha).toLocaleString("es-ES") : ""}
          </div>
          <Markdown texto={briefing} />
        </div>
      ) : (
        <div style={{ background: C.blanco, border: `1px dashed ${C.linea}`, borderRadius: 6, padding: 40, textAlign: "center" }}>
          <p style={{ fontFamily: fontDisplay, fontSize: 17, margin: "0 0 8px" }}>Aún no hay briefing</p>
          <p style={{ fontSize: 13, color: C.tintaSuave, margin: 0 }}>
            Pulsa «Generar briefing de hoy» para que analice las noticias de las últimas horas.
            {posiciones.length === 0 && watchlist.length === 0 && " Añade empresas en Análisis o Cartera para un briefing a tu medida."}
          </p>
        </div>
      )}
    </div>
  );
}

// ============================================================
// ANÁLISIS
// ============================================================
function Analisis({ apiKey, roicKey, tickerPendiente, setTickerPendiente, anthropicKey, analisis, setAnalisis, watchlist, setWatchlist, seguir, setAviso, irAAjustes, diagnostico }) {
  const [ticker, setTicker] = useState("");
  const [cargando, setCargando] = useState(false);
  const [actual, setActual] = useState(null);
  /* Por qué no se pudo, escrito y quieto. Se borra al conseguirlo. */
  const [fallo, setFallo] = useState(null);
  /* La nota de los trimestres pasados, cuando se pide. Por ticker, para que
     cambiar de empresa no enseñe la serie de la anterior. */
  const [series, setSeries] = useState({});
  const [pidiendoSerie, setPidiendoSerie] = useState(false);

  const pedirSerie = async () => {
    if (!actual || pidiendoSerie) return;
    setPidiendoSerie(true);
    apuntar("pidiendo los trimestres de " + actual.ticker + "…");
    try {
      const serie = await historialCuantitativo(actual, apiKey);
      setSeries(function (ya) { const n = { ...ya }; n[actual.ticker] = serie; return n; });
      apuntar("trimestres: " + serie.length + " puntos");
    } catch (e) {
      apuntar("sin trimestres: " + (e && e.message ? e.message : "sin mensaje"));
      setFallo(e.message || "No se han podido reconstruir los trimestres");
    }
    setPidiendoSerie(false);
  };

  const [calculandoCual, setCalculandoCual] = useState(false);

  const calcularCualitativa = async () => {
    if (!actual || calculandoCual) return;
    if (!anthropicKey) { setAviso("Para el índice cualitativo necesitas la clave de Anthropic — guárdala en Ajustes"); irAAjustes(); return; }
    setCalculandoCual(true);
    try {
      const cual = await analisisCualitativo(actual, anthropicKey);
      cual.fecha = new Date().toISOString();
      const actualizado = { ...actual, cualitativa: cual };
      setActual(actualizado);
      setAnalisis({ ...analisis, [actual.ticker]: actualizado });
    } catch (e) {
      setAviso(e.message.indexOf("Anthropic") !== -1 ? e.message : "No se ha podido completar el análisis cualitativo — inténtalo de nuevo en unos segundos");
    }
    setCalculandoCual(false);
  };
  const [calculandoTnd, setCalculandoTnd] = useState(false);
  const [consultandoWS, setConsultandoWS] = useState(false);

  const calcularTendencia = async () => {
    if (!actual || calculandoTnd) return;
    if (actual.fuente === "roic" ? !roicKey : !apiKey) { setAviso("Falta la clave de datos correspondiente en Ajustes"); irAAjustes(); return; }
    setCalculandoTnd(true);
    try {
      const tnd = actual.fuente === "roic"
        ? await tendenciaRoic(actual.ticker, roicKey)
        : await tendencia12m(actual.ticker, apiKey);
      const actualizado = { ...actual, tendencia: tnd };
      setActual(actualizado);
      setAnalisis({ ...analisis, [actual.ticker]: actualizado });
    } catch (e) { setAviso(e.message); }
    setCalculandoTnd(false);
  };

  const consultarConsenso = async () => {
    if (!actual || consultandoWS) return;
    if (actual.fuente === "roic") { setAviso("El consenso de analistas solo está disponible vía FMP (tickers de EE. UU.)"); return; }
    if (!apiKey) { setAviso("Necesitas la clave de FMP en Ajustes"); irAAjustes(); return; }
    setConsultandoWS(true);
    try {
      const cw = await consensoWallStreet(actual.ticker, apiKey, actual.precio, actual.epsTTM);
      const nuevo = { ...actual, consenso: cw };
      setActual(nuevo);
      setAnalisis({ ...analisis, [actual.ticker]: nuevo });
    } catch (e) { setAviso(e.message); }
    setConsultandoWS(false);
  };



  const analizar = async (simboloExterno) => {
    const objetivo = typeof simboloExterno === "string" ? simboloExterno : ticker;
    apuntar("pulsado analizar: " + JSON.stringify(objetivo));
    if (!objetivo.trim()) { apuntar("se para: no hay ticker"); return; }
    if (!apiKey && !roicKey) { apuntar("se para: no hay ninguna clave de datos"); setAviso("Guarda al menos una clave de datos (FMP o ROIC.ai) en Ajustes"); irAAjustes(); return; }
    setCargando(true);
    try {
      let a = null;
      if (apiKey) {
        apuntar("pidiendo a FMP…");
        try { a = await analizarTicker(objetivo, apiKey); apuntar("FMP ha contestado"); }
        catch (e1) { apuntar("FMP falla: " + (e1 && e1.message ? e1.message : "sin mensaje")); if (!roicKey) throw e1; }
      }
      if (!a) {
        apuntar("pidiendo a ROIC.ai…");
        a = await analizarTickerRoic(objetivo, roicKey);
        apuntar("ROIC.ai ha contestado");
      }
      // Si FMP solo ha devuelto el perfil (ficha casi vacía) y hay fuente internacional, la preferimos
      if (a && a.fuente !== "roic" && roicKey && a.limitaciones && a.limitaciones.length >= 3) {
        try {
          const b = await analizarTickerRoic(objetivo, roicKey);
          if (b) a = b;
        } catch (e2) { setAviso("Fuente internacional no disponible ahora: " + e2.message); }
      }
      /*
       * Lo que se calculó aparte se queda.
       *
       * La ficha se rehace entera, pero el cualitativo, la tendencia y el
       * consenso vienen de otros botones y no de aquí. Guardando `a` tal cual
       * se iban los tres sin decir nada, y el cualitativo lo escribe un modelo
       * que se paga por uso. Cada uno lleva su fecha, así que se ve cuál es de
       * cuándo.
       */
      const previo = analisis[a.ticker];
      if (previo) {
        if (previo.cualitativa && !a.cualitativa) a.cualitativa = previo.cualitativa;
        if (previo.tendencia && !a.tendencia) a.tendencia = previo.tendencia;
        if (previo.consenso && !a.consenso) a.consenso = previo.consenso;
      }
      setActual(a);
      setAnalisis({ ...analisis, [a.ticker]: a });
      setTicker("");
      setFallo(null);
      apuntar("guardado " + a.ticker + ", ficha de las " + new Date(a.fecha).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      apuntar("NO se ha podido: " + (e && e.message ? e.message : "sin mensaje"));
      setAviso(e.message);
      // Y escrito donde se queda. El aviso de arriba se borra solo a los seis
      // segundos y medio: quien no estaba mirando se queda sin saber qué pasó.
      setFallo(e.message || "No se ha podido rehacer el análisis");
    } finally {
      // En el `finally` y no detrás del `catch`: si algún día alguien mete un
      // `return` dentro del `try`, el botón se quedaría deshabilitado para
      // siempre y no habría manera de volver a intentarlo.
      setCargando(false);
    }
  };

  useEffect(() => {
    if (tickerPendiente) {
      const t = tickerPendiente;
      setTickerPendiente(null);
      setTicker(t);
      analizar(t);
    }
  }, [tickerPendiente]);


  const enSeguimiento = actual && watchlist.includes(actual.ticker);

  return (
    <div>
      <h2 style={{ fontFamily: fontDisplay, fontSize: 20, margin: "0 0 4px" }}>Análisis de empresa</h2>
      <p style={{ fontSize: 13, color: C.tintaSuave, margin: "0 0 16px" }}>
        Aplica el filtro Lynch —múltiplos máximos según crecimiento— y la proyección de rentabilidad esperada a 5 años.
      </p>
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        <Campo valor={ticker} onChange={setTicker} placeholder="Ticker (AAPL, IP.MI, ASML…)" onEnter={analizar} ancho={220} />
        <Boton onClick={analizar} deshabilitado={cargando}>{cargando ? "Consultando…" : "Analizar"}</Boton>
      </div>

      {Object.keys(analisis).length > 0 && !actual && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, marginBottom: 6 }}>ANÁLISIS RECIENTES</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {Object.values(analisis).slice(-12).reverse().map((a) => (
              <button key={a.ticker} onClick={() => setActual(a)} style={{ background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 4, padding: "5px 10px", fontFamily: fontData, fontSize: 12, cursor: "pointer", color: C.tinta }}>
                {a.ticker}
              </button>
            ))}
          </div>
        </div>
      )}

      <CajaPasos setAviso={setAviso} encendido={diagnostico} />

      {fallo && (
        <div style={{ background: C.rojoClaro, border: "1px solid " + C.rojo, borderRadius: 6, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: C.tinta }}>
          <b>No se ha podido:</b> {fallo}
        </div>
      )}

      {!actual && <Comparativa analisis={analisis} />}

      {actual && (
        <div style={{ background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 6, padding: "20px 24px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
            <div>
              <h3 style={{ fontFamily: fontDisplay, fontSize: 22, margin: 0 }}>{actual.nombre}</h3>
              <div style={{ fontFamily: fontData, fontSize: 12, color: C.tintaSuave, marginTop: 4 }}>
                {actual.ticker} · {actual.sector} · {actual.industria} · {actual.pais}{actual.fuente === "roic" ? " · datos: ROIC.ai" : ""}
                {" · ficha del " + new Date(actual.fecha).toLocaleDateString("es-ES") + " " + new Date(actual.fecha).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}
                {/* Y cuánto hace, que es lo que de verdad se quiere saber. En
                    rojo pasado el mes: a partir de ahí han salido resultados
                    nuevos y el precio se ha movido. */}
                {haceCuanto(actual.fecha) && (
                  <span style={{ color: (Date.now() - new Date(actual.fecha)) / 86400000 > DIAS_VIEJA ? C.rojo : C.tintaSuave, fontWeight: (Date.now() - new Date(actual.fecha)) / 86400000 > DIAS_VIEJA ? 700 : 400 }}>
                    {" (" + haceCuanto(actual.fecha) + ")"}
                  </span>
                )}
              </div>
              <div style={{ fontFamily: fontData, fontSize: 20, fontWeight: 700, marginTop: 10 }}>
                {fmt.moneda(actual.precio, actual.moneda)}
                <span style={{ fontSize: 12, fontWeight: 400, color: C.tintaSuave, marginLeft: 10 }}>Rango 52s: {actual.rango52}</span>
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <Sello veredicto={actual.filtro.veredicto} />
              <div style={{ fontSize: 11, color: C.tintaSuave, marginTop: 8, maxWidth: 220 }}>{actual.filtro.detalle}</div>
              {/* Rehacerla sin volver a teclear el ticker. Los datos de una
                  empresa cambian cada trimestre y el precio todos los días. */}
              <div style={{ marginTop: 10 }}>
                <Boton secundario onClick={() => analizar(actual.ticker)} deshabilitado={cargando}>
                  {cargando ? "Rehaciendo…" : "Rehacer análisis"}
                </Boton>
              </div>
            </div>
          </div>

          {actual.ciclo && (
            <div style={{ marginTop: 14, background: C.latonClaro, border: "1.5px solid " + C.laton, borderRadius: 6, padding: "10px 14px", fontSize: 12, lineHeight: 1.55 }}>
              <b style={{ fontFamily: fontData, letterSpacing: 1 }}>⚠ EMPRESA CÍCLICA</b> ({actual.ciclo.motivo}
              {actual.ciclo.perdidas > 0 ? "; " + actual.ciclo.perdidas + " de los últimos " + actual.ciclo.n + " ejercicios en pérdidas" : ""}).
              {actual.ciclo.sobreciclo != null && actual.ciclo.sobreciclo >= 1.6 ? (
                <span> Su beneficio actual es <b>{fmt.num(actual.ciclo.sobreciclo, 1)}×</b> su media histórica: <b>posible pico de ciclo</b> — el PER bajo engaña. Sobre el beneficio medio, el PER real sería ≈ <b>{fmt.num(actual.ciclo.perNormalizado, 0)}</b>.</span>
              ) : actual.ciclo.sobreciclo != null && actual.ciclo.sobreciclo <= 0.6 ? (
                <span> Su beneficio actual está muy por debajo de su media histórica: <b>posible valle de ciclo</b> — los múltiplos altos engañan, y aquí es donde el value investor mira dos veces.</span>
              ) : (
                <span> En cíclicas, juzga el momento del ciclo y el beneficio medio de varios años, no solo los múltiplos de hoy.</span>
              )}
            </div>
          )}
          <Indices actual={actual} onCalcular={calcularCualitativa} calculando={calculandoCual}
            serie={series[actual.ticker]} pidiendoSerie={pidiendoSerie} onPedirSerie={pedirSerie} />
          <Contrastes a={actual} />
          <PanelPrecios actual={actual} apiKey={apiKey} roicKey={roicKey} setAviso={setAviso} />
          <Tendencia actual={actual} onCalcular={calcularTendencia} calculando={calculandoTnd} />

          {actual.limitaciones && actual.limitaciones.length > 0 && (
            <div style={{ marginTop: 12, background: C.latonClaro, border: "1px solid " + C.laton, borderRadius: 4, padding: "8px 12px", fontSize: 12, color: C.tinta }}>
              No disponible con la fuente de datos actual: {actual.limitaciones.join("; ")}. El resto de la ficha es válido.
            </div>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "0 32px", marginTop: 8 }}>
            {gruposIndicadores(actual).map((g) => (
              <div key={g.titulo}>
                <div style={{ fontFamily: fontData, fontSize: 11, color: C.laton, letterSpacing: 1, margin: "14px 0 4px" }}>{g.titulo}</div>
                {g.items.map((it) => (
                  <Dato key={it.e} etiqueta={it.e} valor={it.v} estado={it.s} tooltip={it.t} />
                ))}
              </div>
            ))}
          </div>

          <ProyeccionPanel a={actual} />

          <PanelConsenso actual={actual} onConsultar={consultarConsenso} consultando={consultandoWS} />

          <div style={{ marginTop: 16, display: "flex", gap: 8 }}>
            <Boton pequeno secundario onClick={() => {
              if (enSeguimiento) setWatchlist(watchlist.filter((w) => w !== actual.ticker));
              else seguir(actual.ticker, actual);
            }}>
              {enSeguimiento ? "✓ En seguimiento — quitar" : "+ Añadir a seguimiento"}
            </Boton>
            <Boton pequeno secundario onClick={() => generarInformePDF(actual)}>Imprimir / PDF</Boton>
            <Boton pequeno secundario onClick={() => setActual(null)}>Cerrar ficha</Boton>
          </div>
        </div>
      )}
    </div>
  );
}

// CARTERA
// ============================================================
function Cartera({ apiKey, posiciones, setPosiciones, watchlist, setWatchlist, setAviso }) {
  const [nuevo, setNuevo] = useState({ ticker: "", acciones: "", precio: "" });
  const [precios, setPrecios] = useState({});
  const [actualizando, setActualizando] = useState(false);
  const [ordenCar, alternarCar] = usarOrden(null);

  const anadir = () => {
    const t = nuevo.ticker.trim().toUpperCase();
    const acc = parseFloat(nuevo.acciones);
    const pre = parseFloat(nuevo.precio);
    if (!t || !acc || !pre || acc <= 0 || pre <= 0) { setAviso("Completa ticker, número de acciones y precio de compra"); return; }
    const existente = posiciones.find((p) => p.ticker === t);
    if (existente) {
      const totalAcc = existente.acciones + acc;
      const precioMedio = (existente.acciones * existente.precioCompra + acc * pre) / totalAcc;
      setPosiciones(posiciones.map((p) => (p.ticker === t ? { ...p, acciones: totalAcc, precioCompra: precioMedio } : p)));
    } else {
      setPosiciones([...posiciones, { ticker: t, acciones: acc, precioCompra: pre, fecha: new Date().toISOString() }]);
    }
    setNuevo({ ticker: "", acciones: "", precio: "" });
  };

  /*
   * Traer la cartera de verdad desde Interactive Brokers.
   *
   * El testigo vive en el servidor y no baja aquí nunca: con él se lee la
   * cuenta entera, así que el navegador solo ve el resultado.
   *
   * No pisa lo que ya hay: lo que está en IBKR manda sobre esa empresa, y lo
   * que se apuntó a mano y no está en el broker se queda. Borrarlo sería
   * perder lo que se lleve fuera de esta cuenta, que no tiene por qué ser
   * todo lo que uno tiene.
   */
  const [trayendo, setTrayendo] = useState(false);

  const traerDeIbkr = async () => {
    setTrayendo(true);
    try {
      const r = await buscarConTope("/api/ibkr");
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "No se ha podido consultar IBKR");

      const suyas = d.posiciones || [];
      if (!suyas.length) {
        setAviso("IBKR no ha devuelto ninguna posición en acciones.");
        setTrayendo(false);
        return;
      }

      const porTicker = new Map(posiciones.map((x) => [x.ticker, x]));
      let nuevas = 0;
      let cambiadas = 0;
      suyas.forEach((n) => {
        const ya = porTicker.get(n.ticker);
        if (!ya) nuevas++;
        else if (ya.acciones !== n.acciones || ya.precioCompra !== n.precioCompra) cambiadas++;
        porTicker.set(n.ticker, {
          ticker: n.ticker,
          acciones: n.acciones,
          // Si IBKR no da el coste, se respeta el que hubiera apuntado a mano:
          // dejarlo a cero convertiría la posición en un resultado inventado.
          precioCompra: n.precioCompra != null ? n.precioCompra : (ya ? ya.precioCompra : 0),
          fecha: ya ? ya.fecha : new Date().toISOString(),
          deIbkr: true,
        });
      });
      setPosiciones([...porTicker.values()]);

      const sobran = (d.fuera || []).length;
      setAviso(
        "IBKR: " + suyas.length + " posiciones (" + nuevas + " nuevas, " + cambiadas + " actualizadas)" +
        (sobran ? " · " + sobran + " fuera por no ser acciones" : "") +
        " · las que tenías a mano y no están en el broker se han quedado"
      );
    } catch (e) {
      setAviso(e.message);
    }
    setTrayendo(false);
  };

  const actualizarPrecios = async () => {
    if (!apiKey) { setAviso("Guarda tu clave de FMP en Ajustes para actualizar precios"); return; }
    if (!posiciones.length) return;
    setActualizando(true);
    try {
      const resultados = await Promise.all(posiciones.map((p) =>
        fmpCotizacion(p.ticker, apiKey).then((precio) => [p.ticker, precio]).catch(() => [p.ticker, null])
      ));
      const nuevos = {};
      let fallos = 0;
      resultados.forEach(([t, precio]) => { if (precio != null) nuevos[t] = precio; else fallos++; });
      setPrecios(nuevos);
      if (fallos > 0) setAviso(fallos + " ticker(s) sin cotización — puede que no estén en tu plan de FMP");
    } catch (e) { setAviso(e.message); }
    setActualizando(false);
  };

  const filasCartera = posiciones.map(function (p) {
    const actualP = precios[p.ticker];
    const valor = actualP ? actualP * p.acciones : null;
    const res = valor !== null ? valor - p.acciones * p.precioCompra : null;
    const resPct = res !== null ? res / (p.acciones * p.precioCompra) : null;
    return { ...p, actualP: actualP, valor: valor, res: res, resPct: resPct };
  });
  const filasCarteraVista = ordenCar ? ordenarPor(filasCartera, ordenCar, {
    ticker: function (p) { return p.ticker; },
    acciones: function (p) { return p.acciones; },
    medio: function (p) { return p.precioCompra; },
    actual: function (p) { return p.actualP; },
    valor: function (p) { return p.valor; },
    res: function (p) { return p.resPct; },
  }) : filasCartera;

  const totalInvertido = posiciones.reduce((s, p) => s + p.acciones * p.precioCompra, 0);
  const hayPrecios = Object.keys(precios).length > 0;
  const valorActual = hayPrecios ? posiciones.reduce((s, p) => s + p.acciones * (precios[p.ticker] != null ? precios[p.ticker] : p.precioCompra), 0) : null;
  const pnl = valorActual !== null ? valorActual - totalInvertido : null;

  return (
    <div>
      <h2 style={{ fontFamily: fontDisplay, fontSize: 20, margin: "0 0 4px" }}>Cartera</h2>
      <p style={{ fontSize: 13, color: C.tintaSuave, margin: "0 0 16px" }}>Registra tus compras; las compras repetidas del mismo ticker promedian el precio.</p>

      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        <Campo valor={nuevo.ticker} onChange={(v) => setNuevo({ ...nuevo, ticker: v })} placeholder="Ticker" ancho={110} />
        <Campo valor={nuevo.acciones} onChange={(v) => setNuevo({ ...nuevo, acciones: v })} placeholder="Nº acciones" tipo="number" ancho={110} />
        <Campo valor={nuevo.precio} onChange={(v) => setNuevo({ ...nuevo, precio: v })} placeholder="Precio compra" tipo="number" ancho={120} onEnter={anadir} />
        <Boton onClick={anadir}>Registrar compra</Boton>
        {posiciones.length > 0 && (
          <Boton secundario onClick={actualizarPrecios} deshabilitado={actualizando}>
            {actualizando ? "Actualizando…" : "Actualizar precios"}
          </Boton>
        )}
        <Boton secundario onClick={traerDeIbkr} deshabilitado={trayendo}>
          {trayendo ? "Consultando IBKR…" : "Traer de IBKR"}
        </Boton>
      </div>

      {posiciones.length > 0 ? (
        <div style={{ background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 6, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ borderBottom: `2px solid ${C.tinta}`, fontFamily: fontData, fontSize: 11, color: C.tintaSuave }}>
                  <Th id="ticker" orden={ordenCar} alternar={alternarCar} alineado="left">TICKER</Th>
                  <Th id="acciones" orden={ordenCar} alternar={alternarCar}>ACCIONES</Th>
                  <Th id="medio" orden={ordenCar} alternar={alternarCar}>P. MEDIO</Th>
                  <Th id="actual" orden={ordenCar} alternar={alternarCar}>P. ACTUAL</Th>
                  <Th id="valor" orden={ordenCar} alternar={alternarCar}>VALOR</Th>
                  <Th id="res" orden={ordenCar} alternar={alternarCar}>RESULTADO</Th>
                  <th style={{ padding: "10px 12px" }}></th>
                </tr>
              </thead>
              <tbody>
                {filasCarteraVista.map((p) => {
                  const actual = p.actualP;
                  const valor = p.valor;
                  const res = p.res;
                  const resPct = p.resPct;
                  return (
                    <tr key={p.ticker} style={{ borderBottom: `1px dotted ${C.linea}` }}>
                      <td style={{ padding: "10px 12px", fontFamily: fontData, fontWeight: 700 }}>{p.ticker}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: fontData }}>{fmt.num(p.acciones, p.acciones % 1 ? 2 : 0)}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: fontData }}>{fmt.num(p.precioCompra)}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: fontData }}>{actual ? fmt.num(actual) : "—"}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: fontData }}>{valor !== null ? fmt.num(valor) : "—"}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: fontData, fontWeight: 700, color: res === null ? C.tintaSuave : res >= 0 ? C.verde : C.rojo }}>
                        {res !== null ? `${res >= 0 ? "+" : ""}${fmt.num(res)} (${fmt.pct(resPct)})` : "—"}
                      </td>
                      <td style={{ padding: "10px 12px", textAlign: "right" }}>
                        <button onClick={() => setPosiciones(posiciones.filter((x) => x.ticker !== p.ticker))} style={{ background: "none", border: "none", color: C.rojo, cursor: "pointer", fontSize: 12 }}>
                          vender/quitar
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ borderTop: `2px solid ${C.tinta}`, fontFamily: fontData, fontWeight: 700 }}>
                  <td style={{ padding: "10px 12px" }}>TOTAL</td>
                  <td colSpan={2} style={{ padding: "10px 12px", textAlign: "right", color: C.tintaSuave, fontWeight: 400 }}>invertido: {fmt.num(totalInvertido)}</td>
                  <td></td>
                  <td style={{ padding: "10px 12px", textAlign: "right" }}>{valorActual !== null ? fmt.num(valorActual) : "—"}</td>
                  <td style={{ padding: "10px 12px", textAlign: "right", color: pnl === null ? C.tintaSuave : pnl >= 0 ? C.verde : C.rojo }}>
                    {pnl !== null ? `${pnl >= 0 ? "+" : ""}${fmt.num(pnl)} (${fmt.pct(pnl / totalInvertido)})` : "—"}
                  </td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      ) : (
        <div style={{ background: C.blanco, border: `1px dashed ${C.linea}`, borderRadius: 6, padding: 30, textAlign: "center", fontSize: 13, color: C.tintaSuave }}>
          Sin posiciones todavía. Registra tu primera compra arriba.
        </div>
      )}

      <div style={{ marginTop: 24 }}>
        <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, marginBottom: 6, letterSpacing: 1 }}>EN SEGUIMIENTO (WATCHLIST)</div>
        {watchlist.length ? (
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {watchlist.map((w) => (
              <span key={w} style={{ background: C.latonClaro, border: `1px solid ${C.laton}55`, borderRadius: 4, padding: "4px 10px", fontFamily: fontData, fontSize: 12 }}>
                {w}
                <button onClick={() => setWatchlist(watchlist.filter((x) => x !== w))} style={{ background: "none", border: "none", color: C.rojo, cursor: "pointer", marginLeft: 6, padding: 0 }}>×</button>
              </span>
            ))}
          </div>
        ) : (
          <p style={{ fontSize: 13, color: C.tintaSuave }}>Añade empresas desde la ficha de Análisis para vigilarlas en el briefing.</p>
        )}
      </div>
    </div>
  );
}

// ============================================================
// AJUSTES
// ============================================================
function Ajustes({ apiKey, setApiKey, roicKey, setRoicKey, roicProxy, setRoicProxy, anthropicKey, setAnthropicKey, diagnostico, setDiagnostico }) {
  const [valorAnt, setValorAnt] = useState(anthropicKey);
  const [guardado, setGuardado] = useState(false);
  return (
    <div style={{ maxWidth: 620 }}>
      <h2 style={{ fontFamily: fontDisplay, fontSize: 20, margin: "0 0 16px" }}>Ajustes</h2>

      <div style={{ background: C.verdeClaro, border: `1px solid ${C.verde}44`, borderRadius: 6, padding: "16px 20px", marginBottom: 16 }}>
        <div style={{ fontFamily: fontData, fontSize: 11, color: C.verde, letterSpacing: 1, marginBottom: 6 }}>1 · DATOS FUNDAMENTALES — YA RESUELTO</div>
        <p style={{ fontSize: 13, color: C.tintaSuave, margin: 0, lineHeight: 1.5 }}>
          Los datos de empresas y las cotizaciones vienen ya configurados: las consultas pasan por el servidor de Delfos, que pone la clave. No tienes que registrarte en ningún sitio ni configurar nada. También funcionan las bolsas de fuera de EE. UU.
        </p>
      </div>

      <div style={{ background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 6, padding: "16px 20px", marginBottom: 16 }}>
        <div style={{ fontFamily: fontData, fontSize: 11, color: C.laton, letterSpacing: 1, marginBottom: 6 }}>2 · BRIEFING CON NOTICIAS (opcional)</div>
        <p style={{ fontSize: 13, color: C.tintaSuave, margin: "0 0 10px", lineHeight: 1.5 }}>
          Esta parte sí necesita una clave tuya de Anthropic (<strong>console.anthropic.com</strong> → API Keys), porque es de pago por uso: un briefing diario cuesta unos pocos céntimos. <strong>Sin ella el resto de la app funciona igual</strong>; solo te perderás el resumen con noticias.
        </p>
        <Campo valor={valorAnt} onChange={(v) => { setValorAnt(v); setGuardado(false); }} placeholder="Clave de API de Anthropic (sk-ant-…)" ancho="100%" />
      </div>

      <Boton onClick={() => { setAnthropicKey(valorAnt.trim()); setGuardado(true); }}>Guardar</Boton>
      {guardado && <p style={{ fontSize: 13, color: C.verde, marginTop: 10 }}>✓ Guardado en tu cuenta.</p>}

      {/* El interruptor del diagnóstico. Apagado casi siempre: solo hace falta
          cuando algo va mal, y una herramienta que enseña siempre sus tripas se
          lee como una que no está acabada. */}
      <div style={{ marginTop: 24, background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 6, padding: "16px 20px" }}>
        <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, letterSpacing: 1, marginBottom: 8 }}>SI ALGO NO VA</div>
        <label style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer", fontSize: 13, lineHeight: 1.5 }}>
          <input type="checkbox" checked={!!diagnostico} onChange={(e) => setDiagnostico(e.target.checked)} style={{ marginTop: 3 }} />
          <span>
            <strong>Enseñar qué hace la aplicación, paso a paso.</strong>
            <span style={{ color: C.tintaSuave }}> Sale una caja con lo que se ha pedido, lo que ha contestado cada fuente y a qué hora, con un botón de copiar. Enciéndelo solo si algo falla: así se puede arreglar leyendo en vez de adivinando.</span>
          </span>
        </label>
      </div>

      <div style={{ marginTop: 16, background: C.latonClaro, border: `1px solid ${C.laton}55`, borderRadius: 6, padding: "12px 16px", fontSize: 12, lineHeight: 1.6, color: C.tinta }}>
        <strong>Tus datos:</strong> la cartera, el seguimiento y los análisis se guardan en tu cuenta del servidor de Delfos, y por eso los tienes igual desde cualquier ordenador. Este navegador conserva una copia para seguir funcionando sin conexión. Ningún otro usuario puede verlos; quien administra Delfos tiene acceso técnico al servidor, como en cualquier aplicación alojada. La clave de Anthropic, si la pones, se guarda ahí también —así la tienes desde cualquier ordenador— y las peticiones viajan directas a Anthropic desde este navegador.
      </div>

      <div style={{ marginTop: 16, background: C.blanco, border: `1px solid ${C.linea}`, borderRadius: 6, padding: "16px 20px", fontSize: 13, lineHeight: 1.6 }}>
        <div style={{ fontFamily: fontData, fontSize: 11, color: C.laton, letterSpacing: 1, marginBottom: 6 }}>METODOLOGÍA Y FUENTES</div>
        <p style={{ margin: "0 0 8px" }}>
          <strong>Filtro de múltiplos ajustados al crecimiento</strong> · <em>Peter Lynch</em>. El PER y el EV/EBITDA máximos aceptables dependen del crecimiento histórico del beneficio por acción: a menos del 5 % de CAGR se exige PER &lt; 16; hasta el 10 %, PER &lt; 20; y así escalonadamente hasta 35 para crecimientos superiores al 20 %. Es la traducción práctica de su principio del PEG: el PER justo se parece a la tasa de crecimiento.
        </p>
        <p style={{ margin: "0 0 8px" }}>
          <strong>Proyección a 5 años · rentabilidad esperada.</strong> Se proyecta el beneficio por acción al ritmo histórico (con tope del 25 % por prudencia), se aplica un PER objetivo no superior al máximo razonable, y de ahí salen el precio estimado y la TIR anual esperada, dividendo incluido. Es el método estándar de valoración por múltiplos futuros, sin autor único.
        </p>
        <p style={{ margin: "0 0 8px" }}>
          <strong>Índice cuantitativo.</strong> Reúne los 25 indicadores en una nota de 0 a 100 repartida en cinco bloques: valoración (30 %), rentabilidad y calidad del negocio (30 %), solvencia (20 %), accionista (10 %) y eficiencia (5 %). La calidad —ROIC, márgenes— recoge la idea de <em>Buffett y Munger</em> de preferir un buen negocio a un precio justo antes que uno mediocre muy barato; la solvencia, el margen de seguridad de <em>Graham</em>; y el bloque de accionista vigila si te diluyen o si recompran.
        </p>
        <p style={{ margin: "0 0 8px" }}>
          <strong>Contrastes independientes.</strong> El <strong>F-Score</strong> de <em>Joseph Piotroski</em> comprueba nueve señales de que las cuentas mejoran respecto al año anterior; nació precisamente para distinguir, entre empresas baratas, las que se están recuperando de las trampas de valor. El <strong>Z-Score</strong> de <em>Edward Altman</em> estima el riesgo de quiebra a dos años. Ninguno se calcula en bancos ni aseguradoras: sus componentes no significan lo mismo en un balance financiero.
        </p>
        <p style={{ margin: 0 }}>
          <strong>Líderes · fuerza relativa (O'Neil)</strong> · <em>William O'Neil</em>. Ordena por comportamiento del precio frente al mercado, el eje de su método CAN SLIM. <strong>Vivero</strong> busca empresas en inflexión, los <em>turnarounds</em> de Lynch. <strong>Radar</strong> rastrea desplomes, en la línea del «punto de máximo pesimismo» de <em>John Templeton</em>.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
