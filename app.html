// ============================================================
// DELFOS 2000 — versión autónoma (fuera de Claude)
//  · Datos fundamentales: FinancialModelingPrep (clave gratuita)

const C = {
  papel: "#F2F4EF", tinta: "#14231C", tintaSuave: "#3D5247", linea: "#C9D1C4",
  verde: "#1E6B4E", verdeClaro: "#E3EEE7", rojo: "#B3372E", rojoClaro: "#F5E4E2",
  laton: "#8A6D1F", latonClaro: "#F0E8D2", blanco: "#FBFCFA",
};
const fontData = "'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace";
const fontDisplay = "'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif";
const fontBody = "-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif";
const STORAGE_KEY = "libro-mayor-datos";

// ---------- Persistencia local ----------
const almacen = {
  leer() {
    try { const v = localStorage.getItem(STORAGE_KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  },
  guardar(d) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); return true; }
    catch (e) { return false; }
  },

  /*
   * Y la copia buena, en el servidor.
   *
   * El local se queda como copia de trabajo: es lo que hace que esto siga
   * funcionando sin red, y lo que se pinta al abrir sin esperar a nadie. El
   * servidor es lo que viaja entre ordenadores y lo que puede leer un proceso
   * programado, que era el motivo por el que el correo diario no se podía
   * hacer.
   */
  /*
   * Devuelve los datos, null si no hay nada guardado, y undefined si no se ha
   * podido preguntar.
   *
   * La diferencia entre las dos últimas no es un detalle: «no hay nada» invita
   * a subir lo de este navegador, y «no he podido preguntar» tiene que impedir
   * exactamente eso, porque lo de aquí puede ser más viejo que lo de allí.
   */
  async leerDelServidor() {
    try {
      const r = await buscarConTope("/api/datos", { headers: { Accept: "application/json" } });
      if (!r.ok) return undefined;
      const j = await r.json();
      return j && j.datos ? j.datos : null;
    } catch (e) {
      return undefined;
    }
  },

  async guardarEnServidor(d) {
    const r = await buscarConTope("/api/datos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ datos: d }),
    });
    const j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.error || "No se han podido guardar tus datos en el servidor");
    return j;
  },
};

// ---------- Cuánto hace de algo ----------
// Una fecha obliga a restar de cabeza para saber si lo que se mira es de esta
// semana o del trimestre pasado. Los días dichos en claro, no.
function haceCuanto(iso) {
  if (!iso) return null;
  const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (!Number.isFinite(dias) || dias < 0) return null;
  if (dias === 0) return "hoy";
  if (dias === 1) return "ayer";
  // Días hasta los tres meses. «Hace un mes» para cuarenta y tres días se
  // queda corto, y lo que se quiere saber aquí es justamente cuánto se ha
  // movido el mundo desde entonces.
  if (dias < 90) return "hace " + dias + " días";
  const meses = Math.floor(dias / 30);
  return meses === 1 ? "hace un mes" : "hace " + meses + " meses";
}
// A partir de aquí la ficha ya no describe lo que pasa hoy: han salido
// resultados nuevos y el precio se ha movido lo suyo.
const DIAS_VIEJA = 30;

// ---------- Filtro Lynch: múltiplos máximos según el crecimiento ----------
function perMaximo(cagr) {
  if (cagr < 0.05) return 16;
  if (cagr < 0.1) return 20;
  if (cagr < 0.15) return 25;
  if (cagr < 0.2) return 30;
  return 35;
}
function evEbitdaMaximo(cagr) {
  if (cagr < 0.05) return 9;
  if (cagr < 0.1) return 11;
  if (cagr < 0.15) return 13;
  if (cagr < 0.2) return 15;
  return 17;
}
function calcularVeredicto(cagr, per, evEbitda) {
  const aplica = cagr > 0 && per > 0 && evEbitda > 0;
  if (!aplica) return { aplica: false, veredicto: "NO APLICABLE", detalle: "Necesita beneficios y crecimiento positivos" };
  const perMax = perMaximo(cagr);
  const evMax = evEbitdaMaximo(cagr);
  const okPer = per < perMax;
  const okEv = evEbitda < evMax;
  let veredicto, detalle;
  if (okPer && okEv) { veredicto = "PRECIO ATRACTIVO"; detalle = "PER y EV/EBITDA por debajo de los máximos razonables para su crecimiento"; }
  else if (okPer || okEv) { veredicto = "PRECIO RAZONABLE"; detalle = okPer ? "PER contenido, pero EV/EBITDA exigente" : "EV/EBITDA contenido, pero PER exigente"; }
  else { veredicto = "PRECIO EXIGENTE"; detalle = "Ambos múltiplos superan lo razonable para su crecimiento"; }
  return { aplica: true, veredicto, detalle, perMax, evMax, okPer, okEv };
}

// ---------- Valoración a 5 años ----------
function valoracion5y(epsTTM, cagr, perActual, precio, dividendo) {
  if (!epsTTM || epsTTM <= 0 || !cagr || cagr <= 0 || !precio) return null;
  const g = Math.min(cagr, 0.25);
  const perObjetivo = Math.min(perActual > 0 ? perActual : perMaximo(g), perMaximo(g));
  const eps5 = epsTTM * Math.pow(1 + g, 5);
  const precio5 = eps5 * perObjetivo;
  const yield_ = dividendo && precio ? dividendo / precio : 0;
  const tir5 = Math.pow(precio5 / precio, 1 / 5) - 1 + yield_;
  const tir3 = Math.pow((epsTTM * Math.pow(1 + g, 3) * perObjetivo) / precio, 1 / 3) - 1 + yield_;
  return { eps5, perObjetivo, precio5, tir5, tir3, potencial: precio5 / precio - 1, g };
}
/**
 * Años que abarca el CAGR: la racha reciente de beneficios positivos.
 * Con uno o dos años el dato es anecdótico, sobre todo si la empresa
 * viene de pérdidas: crecer desde casi cero da porcentajes enormes que
 * no describen el negocio.
 */
function aniosDelCagr(valores) {
  const limpios = (valores || []).filter(function (v) { return typeof v === "number" && !isNaN(v); });
  if (limpios.length < 2 || limpios[0] <= 0) return 0;
  let i = 1;
  while (i < limpios.length && limpios[i] > 0) i++;
  return i - 1;
}

function cagrDesdeSerie(valores) {
  // Serie del más reciente al más antiguo. En empresas cíclicas el histórico incluye años en pérdidas,
  // así que usamos la racha más reciente de EPS positivos: el crecimiento de su etapa buena actual.
  const limpios = valores.filter(function (v) { return typeof v === "number" && !isNaN(v); });
  if (limpios.length < 2) return null;
  const fin = limpios[0];
  if (fin <= 0) return null;
  let i = 1;
  while (i < limpios.length && limpios[i] > 0) i++;
  const anios = i - 1;
  if (anios < 1) return null;
  const ini = limpios[anios];
  if (ini <= 0) return null;
  return Math.pow(fin / ini, 1 / anios) - 1;
}

// ---------- Señales que salen del histórico (Buffett: mirar al accionista) ----------

/**
 * Variación anual media del número de acciones en los últimos años.
 * Negativa = la empresa recompra (tu parte crece). Positiva = te diluyen.
 */
function variacionAcciones(serie) {
  const limpios = (serie || []).filter(function (v) { return typeof v === "number" && v > 0; });
  if (limpios.length < 3) return null;
  const anios = Math.min(limpios.length - 1, 5);
  const reciente = limpios[0];
  const antiguo = limpios[anios];
  if (!antiguo) return null;
  return Math.pow(reciente / antiguo, 1 / anios) - 1;
}

/** Proporción de años con beneficio positivo: mide la regularidad del negocio. */
function regularidadBeneficio(serie) {
  const limpios = (serie || []).filter(function (v) { return typeof v === "number" && !isNaN(v); });
  if (limpios.length < 3) return null;
  const positivos = limpios.filter(function (v) { return v > 0; }).length;
  return positivos / limpios.length;
}

// ---------- Formato ----------
const fmt = {
  num: (v, d = 2) => (v === null || v === undefined || isNaN(v) ? "n/d" : Number(v).toLocaleString("es-ES", { maximumFractionDigits: d, minimumFractionDigits: d })),
  pct: (v, d = 1) => (v === null || v === undefined || isNaN(v) ? "n/d" : (v * 100).toLocaleString("es-ES", { maximumFractionDigits: d, minimumFractionDigits: d }) + " %"),
  moneda: (v, cur = "USD") => (v === null || v === undefined || isNaN(v) ? "n/d" : Number(v).toLocaleString("es-ES", { style: "currency", currency: cur, maximumFractionDigits: 2 })),
  cap: (v) => {
    if (!v || isNaN(v)) return "n/d";
    if (v >= 1e12) return fmt.num(v / 1e12, 2) + " B$";
    if (v >= 1e9) return fmt.num(v / 1e9, 1) + " mM";
    if (v >= 1e6) return fmt.num(v / 1e6, 0) + " M";
    return fmt.num(v, 0);
  },
};

// ---------- API FMP (API nueva "Stable" con respaldo a la antigua v3) ----------
// Las peticiones pasan por el servidor de Delfos, que es quien pone la clave.
// Así nadie necesita sacarse una propia ni queda expuesta en el navegador.
const FMP_BASE = "/api/fmp";

// Valor simbólico: el servidor sustituye la clave real antes de salir.
const CLAVE_SERVIDOR = "servidor";

/* ---------- Bitácora: qué ha hecho la aplicación, paso a paso ----------
 *
 * Existe para poder contestar a «no funciona». Sin esto no se ve si se pulsó el
 * botón, si salió la petición ni qué contestó, y se acaba arreglando a ciegas.
 * Vive fuera de React para que la puedan escribir también los errores sueltos.
 */
const BITACORA = [];
const oyentes = new Set();

function apuntar(texto) {
  const hora = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  BITACORA.push(hora + "  " + texto);
  // Lo viejo se tira: esto es para mirar lo de ahora, no un archivo.
  if (BITACORA.length > 40) BITACORA.shift();
  oyentes.forEach(function (f) { try { f(BITACORA.slice()); } catch (e) {} });
}

/*
 * Lo que se escapa de un `try`, que es lo que deja la pantalla muda.
 *
 * Un error dentro de una promesa sin `catch` no lo ve nadie: no sale aviso, no
 * sale cuadro, y desde fuera parece que el botón no hace nada.
 */
if (typeof window !== "undefined") {
  window.addEventListener("error", function (e) {
    apuntar("ERROR suelto: " + (e.message || "sin mensaje"));
  });
  window.addEventListener("unhandledrejection", function (e) {
    const r = e.reason;
    apuntar("ERROR sin recoger: " + ((r && (r.message || r)) || "sin mensaje"));
  });
}

function traducirErrorFMP(msg, status) {
  const m = String(msg || "").toLowerCase();
  const original = msg ? ' · FMP dice: "' + String(msg).slice(0, 180) + '"' : "";
  if (m.indexOf("invalid api key") !== -1) return "Clave de FMP no válida — revísala en Ajustes";
  if (status === 429 || m.indexOf("limit reach") !== -1) return "Límite diario de peticiones de FMP alcanzado — espera o vuelve mañana";
  if (m.indexOf("premium") !== -1 || m.indexOf("exclusive") !== -1 || m.indexOf("upgrade") !== -1 || m.indexOf("subscription") !== -1 || status === 402)
    return "Ese dato concreto no entra en el plan gratuito de FMP" + original;
  return "Error consultando FMP" + (status ? " (" + status + ")" : "") + original;
}

/*
 * Cuánto se espera a una petición antes de darla por perdida.
 *
 * El puente del servidor se rinde antes que esto, así que llegar aquí quiere
 * decir que algo se ha quedado colgado por el camino. Veinte segundos es de
 * sobra para cualquier respuesta buena y poco para quedarse mirando.
 */
const ESPERA_MAXIMA = 20000;
/* El modelo tarda más: escribir trescientas palabras no son veinte segundos. */
const ESPERA_MODELO = 90000;

/** Un `fetch` que se rinde en vez de esperar para siempre. */
async function buscarConTope(url, opciones) {
  // El tope lo decide la dirección, no quien llama: pasarlo a mano en cada
  // llamada obligaba a tocar seis sitios, y en tres se rompió la sintaxis.
  const alModelo = String(url).indexOf("api.anthropic.com") !== -1;
  const corte = new AbortController();
  const reloj = setTimeout(() => corte.abort(), alModelo ? ESPERA_MODELO : ESPERA_MAXIMA);
  try {
    return await fetch(url, { ...(opciones || {}), signal: corte.signal });
  } catch (e) {
    if (e && e.name === "AbortError") {
      throw new Error("La petición ha tardado demasiado y se ha cancelado. Vuelve a intentarlo.");
    }
    throw e;
  } finally {
    clearTimeout(reloj);
  }
}

async function fmpFetch(url) {
  const r = await buscarConTope(url);
  let data = null;
  try { data = await r.json(); } catch (e) { /* respuesta no JSON */ }
  const errMsg = data && !Array.isArray(data) && (data["Error Message"] || data["message"]);
  if (!r.ok || errMsg) {
    const err = new Error(errMsg || ("HTTP " + r.status));
    err.status = r.status;
    throw err;
  }
  return data;
}

// Prueba primero la API nueva (Stable); si falla, la antigua (v3) para cuentas veteranas
async function fmpDual(rutaStable, rutaV3, apiKey) {
  const sep = function (p) { return p.indexOf("?") !== -1 ? "&" : "?"; };
  try {
    return await fmpFetch(FMP_BASE + "/stable/" + rutaStable + sep(rutaStable) + "apikey=" + apiKey);
  } catch (e1) {
    try {
      return await fmpFetch(FMP_BASE + "/api/v3/" + rutaV3 + sep(rutaV3) + "apikey=" + apiKey);
    } catch (e2) {
      const eInfo = String(e2.message || "").toLowerCase().indexOf("legacy") !== -1 ? e1 : e2;
      throw new Error(traducirErrorFMP(eInfo.message, eInfo.status));
    }
  }
}

async function fmpCotizacion(ticker, apiKey) {
  const q = await fmpDual("quote?symbol=" + ticker, "quote/" + ticker, apiKey);
  return q && q[0] ? q[0].price : null;
}

// Los nombres de campo cambian entre la API nueva y la antigua: leemos el primero que exista
function elegir(obj, nombres) {
  if (!obj) return null;
  for (let i = 0; i < nombres.length; i++) {
    const v = obj[nombres[i]];
    if (v !== undefined && v !== null) return v;
  }
  return null;
}

async function analizarTicker(ticker, apiKey) {
  const t = ticker.trim().toUpperCase();
  // Solo el perfil es imprescindible; todo lo demás es opcional y se degrada con elegancia
  let motivoFallo = null;
  function fallo(e) { if (!motivoFallo && e && e.message) motivoFallo = e.message; return []; }
  const [perfil, quote, ratios, metricas, income, balance, flujo] = await Promise.all([
    fmpDual("profile?symbol=" + t, "profile/" + t, apiKey),
    fmpDual("quote?symbol=" + t, "quote/" + t, apiKey).catch(fallo),
    fmpDual("ratios-ttm?symbol=" + t, "ratios-ttm/" + t, apiKey).catch(fallo),
    fmpDual("key-metrics-ttm?symbol=" + t, "key-metrics-ttm/" + t, apiKey).catch(fallo),
    fmpDual("income-statement?symbol=" + t + "&limit=11", "income-statement/" + t + "?limit=11", apiKey)
      .catch(function () {
        // el plan gratuito limita el histórico: reintentamos con 5 años
        return fmpDual("income-statement?symbol=" + t + "&limit=5", "income-statement/" + t + "?limit=5", apiKey)
          .catch(fallo);
      }),
    // Balance y flujo de caja: dos ejercicios bastan para el F-Score y el Z-Score.
    fmpDual("balance-sheet-statement?symbol=" + t + "&limit=3", "balance-sheet-statement/" + t + "?limit=3", apiKey)
      .catch(function () { return []; }),
    fmpDual("cash-flow-statement?symbol=" + t + "&limit=3", "cash-flow-statement/" + t + "?limit=3", apiKey)
      .catch(function () { return []; }),
  ]);
  if (!perfil || !perfil.length) throw new Error('No se ha encontrado "' + t + '" — comprueba el ticker (el plan gratuito de FMP se centra en bolsas de EE. UU.)');
  const p = perfil[0];
  const q = (quote && quote[0]) || {};
  const r = (ratios && ratios[0]) || {};
  const k = (metricas && metricas[0]) || {};

  const limitaciones = [];
  if (!quote || !quote.length) limitaciones.push("cotización");
  if (!ratios || !ratios.length) limitaciones.push("ratios TTM");
  if (!metricas || !metricas.length) limitaciones.push("métricas TTM");
  if (!income || !income.length) limitaciones.push("histórico de resultados (necesario para el CAGR y la proyección)");
  if (limitaciones.length && motivoFallo) limitaciones.push("posible causa: " + motivoFallo);

  let precio = elegir(q, ["price"]);
  if (precio == null) precio = elegir(p, ["price"]);

  const epsSerie = (income || []).map(function (x) { return elegir(x, ["epsDiluted", "epsdiluted", "eps"]); });
  const cagrEPS = cagrDesdeSerie(epsSerie);
  const aniosCagr = aniosDelCagr(epsSerie);
  // Un crecimiento medido sobre uno o dos años —o disparado porque se parte
  // de casi nada— hincha el PER máximo permitido y la proyección a 5 años.
  if (cagrEPS !== null && (aniosCagr < 3 || cagrEPS > 0.5)) {
    limitaciones.push(
      "⚠ el crecimiento del " + fmt.pct(cagrEPS) + " se apoya solo en " + aniosCagr +
      (aniosCagr === 1 ? " año" : " años") + " de beneficios positivos" +
      (cagrEPS > 0.5 ? " y parte de una base muy baja" : "") +
      ": infla el PER máximo permitido y la proyección a 5 años. Tómalos con mucha cautela."
    );
  }
  // Número de acciones año a año: revela si te diluyen o si recompran.
  const accionesSerie = (income || []).map(function (x) {
    return elegir(x, ["weightedAverageShsOutDil", "weightedAverageShsOut", "sharesOutstanding"]);
  });

  let per = elegir(q, ["pe"]);
  if (per == null) per = elegir(r, ["priceToEarningsRatioTTM", "peRatioTTM"]);

  let evEbitda = elegir(r, ["enterpriseValueMultipleTTM"]);
  if (evEbitda == null) evEbitda = elegir(k, ["evToEBITDATTM", "enterpriseValueOverEBITDATTM"]);

  let epsTTM = elegir(q, ["eps"]);
  if (epsTTM == null) epsTTM = elegir(k, ["netIncomePerShareTTM"]);
  if (epsTTM == null && per > 0 && precio) epsTTM = precio / per;

  const dividendo = elegir(p, ["lastDividend", "lastDiv"]) || 0;

  let cap = elegir(p, ["marketCap", "mktCap"]);
  if (cap == null) cap = elegir(q, ["marketCap"]);

  let yLow = elegir(q, ["yearLow"]);
  let yHigh = elegir(q, ["yearHigh"]);
  if ((yLow == null || yHigh == null) && typeof p.range === "string" && p.range.indexOf("-") !== -1) {
    const partes = p.range.split("-");
    yLow = parseFloat(partes[0]);
    yHigh = parseFloat(partes[partes.length - 1]);
  }

  let deudaPatrimonio = elegir(r, ["debtToEquityRatioTTM", "debtEquityRatioTTM"]);
  if (deudaPatrimonio == null) deudaPatrimonio = elegir(k, ["debtToEquityTTM"]);

  let roe = elegir(k, ["returnOnEquityTTM"]);
  if (roe == null) roe = elegir(r, ["returnOnEquityTTM"]);

  // Defensas contra datos desfasados: fecha de la cotización y coherencia con el rango 52s
  const tsCot = q.timestamp;
  if (typeof tsCot === "number") {
    const fCot = new Date(tsCot * 1000);
    if (!isNaN(fCot.getTime()) && Date.now() - fCot.getTime() > 5 * 86400000) {
      limitaciones.push("⚠ cotización con fecha antigua (" + fCot.toLocaleDateString("es-ES") + ") — verifica el precio en tu bróker antes de decidir");
    }
  }
  if (precio != null && yLow != null && yHigh != null && (precio < yLow * 0.98 || precio > yHigh * 1.02)) {
    limitaciones.push("⚠ el precio queda fuera del rango de 52 semanas: posible dato desfasado — contrástalo");
  }

  const ciclo = detectarCiclo(
    epsSerie.filter(function (v) { return typeof v === "number" && !isNaN(v); }),
    epsTTM, precio, p.sector, p.industry
  );

  // Piotroski y Altman se diseñaron para empresas no financieras: en un banco
  // la liquidez, el capital circulante o la rotación de activos no significan
  // lo mismo, así que ni se calculan.
  const esFinanciera = tipoNegocio(p.sector, p.industry) === "financiera";
  const fScore = esFinanciera ? null : fScorePiotroski(income, balance, flujo);
  const zScore = esFinanciera ? null : zScoreAltman(income, balance);
  if (!esFinanciera && !fScore && (!balance || !balance.length)) {
    limitaciones.push("sin balance ni flujo de caja: no se han podido calcular el F-Score ni el Z-Score");
  }

  const filtro = calcularVeredicto(cagrEPS != null ? cagrEPS : -1, per != null ? per : -1, evEbitda != null ? evEbitda : -1);
  const val = cagrEPS ? valoracion5y(epsTTM, cagrEPS, per, precio, dividendo) : null;

  return {
    ticker: t, nombre: p.companyName, sector: p.sector, industria: p.industry, pais: p.country,
    moneda: p.currency || "USD", precio: precio, cap: cap, beta: p.beta,
    rango52: fmt.num(yLow) + " – " + fmt.num(yHigh),
    per: per, evEbitda: evEbitda, epsTTM: epsTTM, cagrEPS: cagrEPS, dividendo: dividendo,
    yield_: dividendo && precio ? dividendo / precio : 0,
    pb: elegir(r, ["priceToBookRatioTTM", "ptbRatioTTM"]),
    pfcf: elegir(r, ["priceToFreeCashFlowRatioTTM", "priceToFreeCashFlowsRatioTTM", "pfcfRatioTTM"]),
    ps: elegir(r, ["priceToSalesRatioTTM"]),
    peg: elegir(r, ["priceToEarningsGrowthRatioTTM", "priceEarningsToGrowthRatioTTM", "pegRatioTTM"]),
    fcfYield: (function () { var v = elegir(k, ["freeCashFlowYieldTTM"]); return v != null ? v : elegir(r, ["freeCashFlowYieldTTM"]); })(),
    margenBruto: elegir(r, ["grossProfitMarginTTM"]),
    margenNeto: elegir(r, ["netProfitMarginTTM"]),
    margenOperativo: elegir(r, ["operatingProfitMarginTTM"]),
    roe: roe,
    roa: (function () { var v = elegir(k, ["returnOnAssetsTTM"]); return v != null ? v : elegir(r, ["returnOnAssetsTTM"]); })(),
    roic: (function () { var v = elegir(k, ["returnOnInvestedCapitalTTM"]); return v != null ? v : elegir(r, ["returnOnCapitalEmployedTTM"]); })(),
    deudaPatrimonio: deudaPatrimonio,
    deudaNetaEbitda: elegir(k, ["netDebtToEBITDATTM"]),
    coberturaIntereses: elegir(r, ["interestCoverageRatioTTM", "interestCoverageTTM"]),
    quickRatio: elegir(r, ["quickRatioTTM"]),
    currentRatio: elegir(r, ["currentRatioTTM"]),
    rotacionActivos: (function () { var v = elegir(r, ["assetTurnoverTTM"]); return v != null ? v : elegir(k, ["assetTurnoverTTM"]); })(),
    diasCobro: elegir(r, ["daysOfSalesOutstandingTTM", "daysSalesOutstandingTTM"]),
    payout: elegir(r, ["dividendPayoutRatioTTM", "payoutRatioTTM"]),
    ciclo: ciclo,
    epsSerie: epsSerie, accionesSerie: accionesSerie,
    fScore: fScore, zScore: zScore,
    limitaciones: limitaciones,
    filtro: filtro, val: val, fecha: new Date().toISOString(),
  };
}

// ---------- Briefing con la API de Anthropic (clave propia) ----------
async function generarBriefing(anthropicKey, posiciones, watchlist, analisisPrevios) {
  if (!anthropicKey) throw new Error("Para el briefing con noticias necesitas una clave de API de Anthropic — guárdala en Ajustes");
  const empresas = [
    ...posiciones.map((p) => `${p.ticker} (en cartera, ${p.acciones} acciones)`),
    ...watchlist.map((w) => `${w} (en seguimiento)`),
  ];
  const sectores = [...new Set(Object.values(analisisPrevios).map((a) => a.sector).filter(Boolean))];
  const hoy = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const prompt = `Eres el analista de cabecera de un inversor value particular en España. Hoy es ${hoy}.

Su universo de inversión:
${empresas.length ? empresas.join("\n") : "(aún sin posiciones — busca ideas value generales)"}
Sectores presentes: ${sectores.length ? sectores.join(", ") : "sin datos"}

Busca en la web las noticias más relevantes de las últimas 48-72 horas y redacta un briefing matinal en español con exactamente estas secciones (usa ## para cada título):

## Contexto macro y geopolítica
Lo que de verdad puede mover mercados: bancos centrales, conflictos, energía, divisas. Máximo 4 frases.

## Tus empresas y sectores
Noticias concretas que afecten a las empresas o sectores listados arriba. Si no hay nada relevante, dilo sin rellenar.

## Regulación y nuevas leyes
Cambios legislativos (UE, EE. UU., España) que afecten a los sectores del inversor o creen oportunidades/riesgos.

## Tendencias de fondo
1-2 tendencias estructurales (tecnología, demografía, transición energética...) con ángulo de inversión value.

## Idea del día
Una empresa cotizada concreta que merezca análisis value esta semana, con el porqué en 2-3 frases. No es una recomendación de compra, es una candidata a estudiar.

Sé concreto, cita cifras cuando las tengas, y evita el relleno. Tono sobrio, de nota interna.`;

  const resp = await buscarConTope("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 2000,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!resp.ok) {
    if (resp.status === 401) throw new Error("Clave de Anthropic no válida — revísala en Ajustes");
    throw new Error("No se ha podido generar el briefing — inténtalo de nuevo");
  }
  const data = await resp.json();
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}

// ---------- Render sencillo de markdown ----------
function negritas(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function Markdown({ texto }) {
  const lineas = (texto || "").split("\n");
  return (
    <div>
      {lineas.map((l, i) => {
        const t = l.trim();
        if (!t) return <div key={i} style={{ height: 8 }} />;
        if (t.startsWith("## "))
          return <h3 key={i} style={{ fontFamily: fontDisplay, fontSize: 17, margin: "18px 0 6px", color: C.tinta, borderBottom: `1px solid ${C.linea}`, paddingBottom: 4 }}>{t.slice(3)}</h3>;
        if (t.startsWith("- ") || t.startsWith("* "))
          return (
            <div key={i} style={{ display: "flex", gap: 8, margin: "3px 0", fontSize: 14, lineHeight: 1.55 }}>
              <span style={{ color: C.laton }}>·</span>
              <span dangerouslySetInnerHTML={{ __html: negritas(t.slice(2)) }} />
            </div>
          );
        return <p key={i} style={{ fontSize: 14, lineHeight: 1.55, margin: "4px 0" }} dangerouslySetInnerHTML={{ __html: negritas(t) }} />;
      })}
    </div>
  );
}

// ---------- Componentes de apoyo ----------
// ---------- Semáforos ----------
// sem(valor, umbralBien, umbralRegular, invertido): si invertido, más bajo = mejor
function sem(v, bien, regular, invertido) {
  if (v === null || v === undefined || isNaN(v)) return null;
  if (!invertido) return v >= bien ? "bien" : v >= regular ? "regular" : "mal";
  return v <= bien ? "bien" : v <= regular ? "regular" : "mal";
}
/*
 * Lo mismo que `sem`, pero sin escalones: una rampa entre los mismos cortes.
 *
 * Se apoya en los dos puntos que ya había —`bien` vale 100 y `regular` vale
 * 50— y rellena lo de en medio en línea recta. El cero se pone un tramo más
 * allá de `regular`, a la misma distancia que hay de `regular` a `bien`, para
 * que la caída tenga la misma pendiente que la subida y no haya un precipicio.
 *
 * Fuera de los extremos se queda en 100 o en 0: una empresa muy barata ya está
 * tan bien como esta métrica sabe decir, y estirarlo más sería inventarse
 * precisión que no hay.
 */
function semSuave(v, bien, regular, invertido) {
  if (v === null || v === undefined || isNaN(v)) return null;
  const tramo = Math.abs(regular - bien);
  if (!tramo) return sem(v, bien, regular, invertido) === "bien" ? 100 : 0;
  const malo = invertido ? regular + tramo : regular - tramo;
  // Dónde cae `v` entre «malo» (0) y «bien» (100).
  const parte = (v - malo) / (bien - malo);
  return Math.max(0, Math.min(100, Math.round(parte * 100)));
}

function semRango(v, minBien, maxBien, minReg, maxReg) {
  if (v === null || v === undefined || isNaN(v)) return null;
  if (v >= minBien && v <= maxBien) return "bien";
  if (v >= minReg && v <= maxReg) return "regular";
  return "mal";
}
const SEMCOLOR = { bien: "#1E6B4E", regular: "#8A6D1F", mal: "#B3372E" };

function Dato({ etiqueta, valor, estado, tooltip }) {
  const [abierto, setAbierto] = useState(false);
  const color = estado && SEMCOLOR[estado] ? SEMCOLOR[estado] : null;
  return (
    <div
      onMouseEnter={() => setAbierto(true)}
      onMouseLeave={() => setAbierto(false)}
      onClick={() => setAbierto(!abierto)}
      style={{ position: "relative", padding: "8px 0", borderBottom: "1px dotted " + C.linea, display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, cursor: tooltip ? "help" : "default" }}

      <span style={{ fontFamily: fontData, fontSize: 14, fontWeight: 600, color: color || C.tinta, display: "inline-flex", alignItems: "center", gap: 6 }}>
        {color && <span style={{ width: 8, height: 8, borderRadius: "50%", background: color, display: "inline-block", flexShrink: 0 }} />}
        {valor}

    </div>
  );
}

// ============================================================
// F-SCORE DE PIOTROSKI (0-9)
// ------------------------------------------------------------
// Nueve comprobaciones binarias sobre la evolución de las cuentas.
// Joseph Piotroski demostró que, dentro del universo «barato», separa
// bastante bien las empresas que están mejorando de las trampas de valor.
// ============================================================
function fScorePiotroski(income, balance, flujo) {
  const i0 = (income || [])[0], i1 = (income || [])[1];
  const b0 = (balance || [])[0], b1 = (balance || [])[1];
  const f0 = (flujo || [])[0], f1 = (flujo || [])[1];
  if (!i0 || !i1 || !b0 || !b1 || !f0) return null;

  const activos0 = elegir(b0, ["totalAssets"]), activos1 = elegir(b1, ["totalAssets"]);
  if (!activos0 || !activos1) return null;

  const bn0 = elegir(i0, ["netIncome"]), bn1 = elegir(i1, ["netIncome"]);
  const cfo0 = elegir(f0, ["netCashProvidedByOperatingActivities", "operatingCashFlow"]);
  const cfo1 = f1 ? elegir(f1, ["netCashProvidedByOperatingActivities", "operatingCashFlow"]) : null;
  const roa0 = bn0 / activos0, roa1 = bn1 / activos1;

  const ldDeuda0 = elegir(b0, ["longTermDebt"]) || 0, ldDeuda1 = elegir(b1, ["longTermDebt"]) || 0;
  const ac0 = elegir(b0, ["totalCurrentAssets"]), pc0 = elegir(b0, ["totalCurrentLiabilities"]);
  const ac1 = elegir(b1, ["totalCurrentAssets"]), pc1 = elegir(b1, ["totalCurrentLiabilities"]);
  const cr0 = ac0 && pc0 ? ac0 / pc0 : null, cr1 = ac1 && pc1 ? ac1 / pc1 : null;

  const acc0 = elegir(i0, ["weightedAverageShsOutDil", "weightedAverageShsOut"]);
  const acc1 = elegir(i1, ["weightedAverageShsOutDil", "weightedAverageShsOut"]);

  const ventas0 = elegir(i0, ["revenue"]), ventas1 = elegir(i1, ["revenue"]);
  const bruto0 = elegir(i0, ["grossProfit"]), bruto1 = elegir(i1, ["grossProfit"]);
  const mb0 = ventas0 ? bruto0 / ventas0 : null, mb1 = ventas1 ? bruto1 / ventas1 : null;
  const rot0 = ventas0 / activos0, rot1 = ventas1 / activos1;

  const pruebas = [
    { grupo: "Rentabilidad", e: "Gana dinero", ok: bn0 > 0, d: "Beneficio neto positivo este año." },
    { grupo: "Rentabilidad", e: "Genera caja", ok: cfo0 > 0, d: "El negocio produce caja, no solo beneficio contable." },
    { grupo: "Rentabilidad", e: "Mejora el ROA", ok: roa0 > roa1, d: "Rentabilidad sobre activos mejor que el año pasado." },
    { grupo: "Rentabilidad", e: "Beneficio con respaldo", ok: cfo0 > bn0, d: "La caja generada supera al beneficio: las cuentas no se apoyan en apuntes." },
    { grupo: "Solidez", e: "Menos deuda a largo", ok: (ldDeuda0 / activos0) <= (ldDeuda1 / activos1), d: "El peso de la deuda a largo plazo no aumenta." },
    { grupo: "Solidez", e: "Mejor liquidez", ok: cr0 !== null && cr1 !== null ? cr0 > cr1 : null, d: "El current ratio mejora respecto al año anterior." },
    { grupo: "Solidez", e: "Sin diluir", ok: acc0 && acc1 ? acc0 <= acc1 * 1.01 : null, d: "No ha emitido acciones nuevas para financiarse." },
    { grupo: "Eficiencia", e: "Mejor margen bruto", ok: mb0 !== null && mb1 !== null ? mb0 > mb1 : null, d: "El margen bruto se amplía: más poder de fijar precios." },
    { grupo: "Eficiencia", e: "Más rotación", ok: rot0 > rot1, d: "Exprime mejor sus activos que el año pasado." },
  ];

  const evaluadas = pruebas.filter(function (p) { return p.ok !== null; });
  if (evaluadas.length < 6) return null;
  const puntos = evaluadas.filter(function (p) { return p.ok === true; }).length;

  return {
    puntos: puntos,
    sobre: evaluadas.length,
    pruebas: pruebas,
    lectura: puntos >= 8 ? "Muy fuerte" : puntos >= 6 ? "Sólida" : puntos >= 4 ? "Mediocre" : "Débil",
  };
}

// ============================================================
// Z-SCORE DE ALTMAN (versión Z'', válida fuera de la industria pesada)
// ------------------------------------------------------------
// Estima la probabilidad de quiebra a dos años. Por encima de 2,6 se
// considera zona segura; por debajo de 1,1, zona de peligro.
// ============================================================
function zScoreAltman(income, balance) {
  const i0 = (income || [])[0], b0 = (balance || [])[0];
  if (!i0 || !b0) return null;

  const activos = elegir(b0, ["totalAssets"]);
  const pasivos = elegir(b0, ["totalLiabilities"]);
  if (!activos || !pasivos) return null;

  const ac = elegir(b0, ["totalCurrentAssets"]) || 0;
  const pc = elegir(b0, ["totalCurrentLiabilities"]) || 0;
  const reservas = elegir(b0, ["retainedEarnings"]);
  const patrimonio = elegir(b0, ["totalStockholdersEquity", "totalEquity"]);
  const ebit = elegir(i0, ["operatingIncome", "ebit"]);
  if (reservas === null || patrimonio === null || ebit === null) return null;

  const x1 = (ac - pc) / activos;        // capital circulante sobre activos
  const x2 = reservas / activos;          // beneficios acumulados: historia de la empresa
  const x3 = ebit / activos;              // rentabilidad operativa de los activos
  const x4 = patrimonio / pasivos;        // colchón contable frente a lo que debe

  const z = 6.56 * x1 + 3.26 * x2 + 6.72 * x3 + 1.05 * x4;
  return {
    z: z,
    zona: z > 2.6 ? "segura" : z >= 1.1 ? "gris" : "peligro",
    componentes: [
      { e: "Capital circulante / activos", v: x1 },
      { e: "Beneficios acumulados / activos", v: x2 },
      { e: "Resultado operativo / activos", v: x3 },
      { e: "Patrimonio / pasivo total", v: x4 },
    ],
  };
}

// ---------- Tipo de negocio: no todo se mide con la misma vara ----------
/**
 * En un banco, apalancarse ES el negocio: su deuda/patrimonio o su current
 * ratio no dicen lo mismo que en una industrial, y su flujo de caja recoge
 * movimientos de depósitos y préstamos, no dinero sobrante. En un REIT el
 * beneficio contable va lastrado por amortizaciones que no son salidas de
 * caja, y reparte casi todo por obligación legal.
 * Aplicarles los umbrales generales da conclusiones equivocadas.
 */
function tipoNegocio(sector, industria) {
  const s = String(sector || "").toLowerCase();
  const i = String(industria || "").toLowerCase();
  if (i.indexOf("reit") !== -1 || s.indexOf("real estate") !== -1) return "inmobiliaria";
  if (s.indexOf("financial") !== -1 || s.indexOf("financier") !== -1 ||
      i.indexOf("bank") !== -1 || i.indexOf("banco") !== -1 ||
      i.indexOf("insurance") !== -1 || i.indexOf("seguros") !== -1 ||
      i.indexOf("capital markets") !== -1 || i.indexOf("asset management") !== -1) return "financiera";
  return "general";
}

const AVISO_SECTOR = {
  financiera: "Sector financiero: en un banco o aseguradora el apalancamiento es el negocio, así que la deuda, el current ratio y el ROIC no son comparables con los de una industrial. Su flujo de caja tampoco: una rentabilidad FCF desorbitada suele ser un espejismo contable. El índice omite esas métricas y se apoya en el ROE, el precio sobre valor contable y la evolución del beneficio.",
  inmobiliaria: "Sector inmobiliario: las amortizaciones hunden el beneficio contable sin ser salidas de caja, y el reparto de dividendo es alto por obligación legal. El índice no penaliza el payout ni exige los ratios de liquidez habituales. Para valorar de verdad un REIT conviene mirar el FFO, que esta herramienta todavía no calcula.",
};

// ---------- Índice cuantitativo (0-100) a partir de los 25 indicadores ----------
/*
 * Los trimestres pasados de una empresa, puntuados con la misma vara.
 *
 * Se piden los ratios y las métricas por trimestre, y de cada uno se arma una
 * ficha con la forma que espera `notaCuantitativa`. Lo que FMP no devuelva se
 * queda en `null`: el grupo reparte su peso entre lo que sí hay, que es lo que
 * esa función ya hace con una métrica que no aplica.
 *
 * Los nombres de campo se buscan por varios alias porque cambian entre la API
 * nueva y la vieja, igual que en el resto del fichero.
 */
async function historialCuantitativo(a, apiKey, cuantos) {
  const t = a.ticker;
  const n = cuantos || 5;

  /*
   * De lo fino a lo grueso. Los trimestres son de pago en FMP; los años, no.
   * Cada intento se apunta con lo que contestó, que es lo que convierte «no
   * funciona» en «tu plan no da esto».
   */
  const pedir = async function (periodo, cuenta) {
    const cola = (periodo ? "&period=" + periodo : "") + "&limit=" + cuenta;
    const colaV3 = (periodo ? "?period=" + periodo + "&" : "?") + "limit=" + cuenta;
    const par = await Promise.all([
      fmpDual("ratios?symbol=" + t + cola, "ratios/" + t + colaV3, apiKey).catch(function (e) { return { fallo: e.message }; }),
      fmpDual("key-metrics?symbol=" + t + cola, "key-metrics/" + t + colaV3, apiKey).catch(function (e) { return { fallo: e.message }; }),
    ]);
    const r = par[0];
    const sirve = Array.isArray(r) && r.length > 1;
    apuntar("trimestres · " + (periodo || "anual") + ": " +
      (sirve ? r.length + " periodos" : (r && r.fallo ? r.fallo : "sin datos")));
    return sirve ? { ratios: r, metricas: Array.isArray(par[1]) ? par[1] : [], periodo: periodo || "annual" } : null;
  };

  const salida = (await pedir("quarter", n)) || (await pedir("annual", 5)) || (await pedir("", 5));
  if (!salida) {
    throw new Error("Tu plan de FMP no devuelve ni ratios por trimestre ni por año de " + t + ". Mira la caja «qué ha pasado» para ver qué contestó cada intento.");
  }
  const ratios = salida.ratios;
  const metricas = salida.metricas;

  const porFecha = {};
  (Array.isArray(metricas) ? metricas : []).forEach(function (m) { if (m && m.date) porFecha[m.date] = m; });

  const puntos = ratios.map(function (r) {
    const m = (r && r.date && porFecha[r.date]) || {};
    /*
     * La ficha de aquel trimestre. Lo que cambia con el precio y con las
     * cuentas sale de la fecha; el crecimiento, las acciones y el sector se
     * toman de hoy, que es la parte que no se reconstruye.
     */
    const viejo = {
      ticker: a.ticker, sector: a.sector, industria: a.industria,
      filtro: a.filtro, epsSerie: a.epsSerie, accionesSerie: a.accionesSerie,
      dividendo: a.dividendo,
      per: elegir(r, ["priceToEarningsRatio", "priceEarningsRatio", "peRatio"]),
      evEbitda: elegir(r, ["enterpriseValueMultiple", "evToEBITDA"]) || elegir(m, ["evToEBITDA", "enterpriseValueOverEBITDA"]),
      peg: elegir(r, ["priceToEarningsGrowthRatio", "priceEarningsToGrowthRatio"]),
      pfcf: elegir(r, ["priceToFreeCashFlowRatio", "priceToFreeCashFlowsRatio"]),
      pb: elegir(r, ["priceToBookRatio", "priceBookValueRatio"]),
      ps: elegir(r, ["priceToSalesRatio"]),
      fcfYield: elegir(m, ["freeCashFlowYield"]),
      margenBruto: elegir(r, ["grossProfitMargin"]),
      margenOperativo: elegir(r, ["operatingProfitMargin", "operatingIncomeRatio"]),
      margenNeto: elegir(r, ["netProfitMargin", "netIncomeRatio"]),
      roe: elegir(r, ["returnOnEquity"]),
      roa: elegir(r, ["returnOnAssets"]),
      roic: elegir(m, ["returnOnInvestedCapital", "roic"]),
      deudaPatrimonio: elegir(r, ["debtToEquityRatio", "debtEquityRatio"]),
      deudaNetaEbitda: elegir(m, ["netDebtToEBITDA"]),
      currentRatio: elegir(r, ["currentRatio"]),
      quickRatio: elegir(r, ["quickRatio"]),
      coberturaIntereses: elegir(r, ["interestCoverageRatio", "interestCoverage"]),
      payout: elegir(r, ["dividendPayoutRatio", "payoutRatio"]),
      rotacionActivos: elegir(r, ["assetTurnover"]),
      diasCobro: elegir(r, ["daysOfSalesOutstanding", "daysSalesOutstanding"]),
    };
    const c = notaCuantitativa(viejo);
    return { fecha: r.date, nota: c ? c.nota : null, periodo: salida.periodo };
  });

  // De más antiguo a más reciente, que es como se lee un gráfico.
  return puntos.filter(function (x) { return x.nota != null; }).reverse();
}

function notaCuantitativa(a) {
  const f = a.filtro || {};
  const perMax = f.aplica ? f.perMax : 18;
  const evMax = f.aplica ? f.evMax : 11;
  const P = { bien: 100, regular: 50, mal: 0 };
  function punt(estado) { return estado == null ? null : P[estado]; }
  // Cada tipo de negocio se mide con su vara: ver tipoNegocio().
  const tipo = tipoNegocio(a.sector, a.industria);
  const esFin = tipo === "financiera";
  const esInm = tipo === "inmobiliaria";
  // «no aplica»: la métrica se descarta y el grupo reparte su peso entre el resto.
  const na = null;

  const grupos = [
    /*
     * El único bloque que se mide con rampa y no con escalones.
     *
     * Sus siete métricas salen todas del precio, y el precio se mueve todos los
     * días. Con escalones, el score no se enteraba hasta que una de ellas
     * cruzaba un corte: podía encarecerse un treinta por ciento sin mover un
     * punto, y entonces no hay manera de contestar si hoy se compra mejor que
     * hace un mes.
     */
    { nombre: "Valoración", peso: 0.35, notas: [
      semSuave(a.per, perMax, perMax * 1.3, true),
      // El valor de empresa no significa lo mismo cuando la deuda es la materia prima.
      esFin ? na : semSuave(a.evEbitda, evMax, evMax * 1.3, true),
      // Solo se puntúa el PEG si es positivo: si no, la fórmula no aplica.
      a.peg > 0 ? semSuave(a.peg, 1, 2, true) : na,
      // El flujo de caja de bancos e inmobiliarias no es «dinero que sobra».
      esFin || esInm ? na : semSuave(a.pfcf, 15, 25, true),
      semSuave(a.pb, 1.5, 3, true),
      esFin ? na : semSuave(a.ps, 2, 5, true),
      esFin || esInm ? na : semSuave(a.fcfYield, 0.05, 0.02, false),
    ]},
    { nombre: "Rentabilidad", peso: 0.30, notas: [
      punt(sem(a.cagrEPS, 0.10, 0.03, false)),
      // Crecer mucho un año no es lo mismo que ganar dinero todos los años.
      punt(sem(regularidadBeneficio(a.epsSerie), 0.9, 0.6, false)),
      esFin ? na : punt(sem(a.margenBruto, 0.40, 0.20, false)),
      esFin ? na : punt(sem(a.margenOperativo, 0.15, 0.05, false)),
      punt(sem(a.margenNeto, 0.10, 0.03, false)),
      punt(sem(a.roe, 0.15, 0.08, false)),
      // En un banco un ROA del 1 % es sano; en una industrial, alarmante.
      punt(esFin ? sem(a.roa, 0.012, 0.006, false) : sem(a.roa, 0.07, 0.03, false)),
      esFin ? na : punt(sem(a.roic, 0.12, 0.06, false)),
    ]},
    // En una financiera el apalancamiento es el negocio: sin ratios de capital
    // regulatorio (Tier 1), que esta herramienta no descarga, el bloque no aplica
    // y su peso se reparte entre los demás.
    { nombre: "Solvencia", peso: 0.20, notas: esFin ? [] : [
      punt(sem(a.deudaPatrimonio, esInm ? 1.2 : 0.5, esInm ? 2.5 : 1.5, true)),
      punt(sem(a.deudaNetaEbitda, esInm ? 5 : 1.5, esInm ? 8 : 3, true)),
      esInm ? na : punt(semRango(a.currentRatio, 1.5, 3, 1, 4)),
      esInm ? na : punt(sem(a.quickRatio, 1, 0.7, false)),
      punt(sem(a.coberturaIntereses, 8, 3, false)),
    ]},
    // Buffett mira siempre si el número de acciones sube o baja: es la parte
    // del pastel que te corresponde, y casi ningún analizador la vigila.
    { nombre: "Accionista", peso: 0.10, notas: [
      punt(sem(variacionAcciones(a.accionesSerie), 0, 0.02, true)),
      // Un REIT reparte casi todo por ley: penalizar su payout sería absurdo.
      a.dividendo && !esInm ? punt(sem(a.payout, 0.6, 0.8, true)) : na,
    ]},
    { nombre: "Eficiencia", peso: 0.05, notas: esFin ? [] : [
      punt(sem(a.diasCobro, 45, 90, true)),
      esInm ? na : punt(sem(a.rotacionActivos, 0.8, 0.4, false)),
    ]},
  ];
  let total = 0, pesoUsado = 0;
  const desglose = [];
  grupos.forEach(function (g) {
    const validas = g.notas.filter(function (n) { return n !== null; });
    if (!validas.length) { desglose.push({ nombre: g.nombre, nota: null }); return; }
    const media = validas.reduce(function (s, n) { return s + n; }, 0) / validas.length;
    desglose.push({ nombre: g.nombre, nota: Math.round(media) });
    total += media * g.peso;
    pesoUsado += g.peso;
  });
  if (!pesoUsado) return null;
  return {
    nota: Math.round(total / pesoUsado),
    desglose: desglose,
    tipo: tipo,
    avisoSector: AVISO_SECTOR[tipo] || null,
  };
}

function colorNota(n) {
  if (n == null) return "#3D5247";
  return n >= 70 ? "#1E6B4E" : n >= 45 ? "#8A6D1F" : "#B3372E";
}

function construirPromptCualitativo(a, cuant) {

    'Contexto cuantitativo ya calculado: nota numérica ' + (cuant ? cuant.nota : "n/d") + '/100; PER ' + fmt.num(a.per) + '; CAGR del EPS ' + fmt.pct(a.cagrEPS) + '; veredicto de múltiplos: ' + (a.filtro ? a.filtro.veredicto : "n/d") + '.\n\n' +
    'Busca en la web información reciente (últimos 3-6 meses) sobre: noticias de la empresa, su sector, el potencial del mercado y del producto, competencia, regulación y riesgos.\n\n' +
    'Responde SOLO con un objeto JSON válido, sin texto adicional y sin markdown, con esta estructura exacta:\n' +
    '{"nota": 0-100, "foso": 0-10, "potencial": 0-10, "vientos": 0-10, "gestionRiesgos": 0-10, "resumen": "3-4 frases en español", "positivo": ["punto", "punto", "punto"], "negativo": ["punto", "punto", "punto"]}\n\n' +
    'Criterios: foso = ventaja competitiva duradera; potencial = tamaño y crecimiento del mercado y del producto; vientos = noticias, tendencias y regulación recientes, a favor o en contra; gestionRiesgos = calidad de la gestión y riesgos específicos. La nota global pondera todo con espíritu conservador: penaliza la incertidumbre, el bombo y los riesgos regulatorios.';
}

/*
 * Sacar el JSON de lo que ha escrito el modelo. Solo eso.
 *
 * Sin comprobar qué campos trae: cada quien sabe qué espera y lo mira donde lo
 * usa. Esta función llevaba dentro la comprobación de la nota cualitativa, y el
 * día que se reutilizó para otra cosa devolvía «JSON incompleto» aunque la
 * respuesta fuera impecable, porque le faltaba un campo que no le tocaba tener.
 */
function sacarJSON(texto) {
  const limpio = String(texto || "").replace(/```json|```/g, "").trim();
  const ini = limpio.indexOf("{");
  const fin = limpio.lastIndexOf("}");
  if (ini === -1 || fin === -1) throw new Error("La respuesta del modelo no trae ningún JSON");
  try {
    return JSON.parse(limpio.slice(ini, fin + 1));
  } catch (e) {
    // Se corta a media llave cuando el modelo se queda sin tokens.
    throw new Error("El modelo ha devuelto un JSON cortado — suele ser que la respuesta no cabía");
  }
}

/** Lo mismo, y además que traiga la nota: es lo que espera el cualitativo. */
function extraerJSON(texto) {
  const obj = sacarJSON(texto);
  if (typeof obj.nota !== "number") throw new Error("El JSON del modelo no trae la nota");
  return obj;
}

}

                <strong style={{ fontFamily: fontData, fontSize: 10, letterSpacing: 1, color: C.laton, display: "block", marginBottom: 4 }}>VARA DE MEDIR ADAPTADA</strong>

      </div>
      <div style={{ flex: "2 1 340px", background: C.blanco, border: "1.5px solid " + C.tinta, borderRadius: 6, padding: "14px 16px" }}>
        <div style={{ fontFamily: fontData, fontSize: 11, color: C.tintaSuave, letterSpacing: 1 }}>ÍNDICE CUALITATIVO · NEGOCIO Y NOTICIAS</div>
        {cual ? (
          <div>

              {cual.nota}<span style={{ fontSize: 16, color: C.tintaSuave }}> / 100</span>
            </div>
            <div style={{ marginTop: 8 }}>
              <Barrita nombre="Foso competitivo" nota={(cual.foso || 0) * 10} />
              <Barrita nombre="Potencial mercado/producto" nota={(cual.potencial || 0) * 10} />
              <Barrita nombre="Noticias y tendencias" nota={(cual.vientos || 0) * 10} />
              <Barrita nombre="Gestión y riesgos" nota={(cual.gestionRiesgos || 0) * 10} />
            </div>
            <p style={{ fontSize: 13, lineHeight: 1.55, margin: "10px 0 8px" }}>{cual.resumen}</p>
            {(cual.positivo || []).map((x, i) => (
              <div key={"p" + i} style={{ fontSize: 12, display: "flex", gap: 6, margin: "2px 0" }}><span style={{ color: C.verde, fontWeight: 700 }}>+</span><span>{x}</span></div>
            ))}
            {(cual.negativo || []).map((x, i) => (
              <div key={"n" + i} style={{ fontSize: 12, display: "flex", gap: 6, margin: "2px 0" }}><span style={{ color: C.rojo, fontWeight: 700 }}>−</span><span>{x}</span></div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
              <span style={{ fontSize: 10, color: C.tintaSuave }}>Generado con IA y noticias recientes{cual.fecha ? " · " + new Date(cual.fecha).toLocaleDateString("es-ES") : ""}</span>
              <button onClick={onCalcular} disabled={calculando} style={{ background: "none", border: "none", color: C.tintaSuave, cursor: "pointer", fontSize: 11, textDecoration: "underline" }}>
                {calculando ? "investigando…" : "recalcular"}
              </button>
            </div>
          </div>
        ) : (
          <div style={{ marginTop: 8 }}>
            <p style={{ fontSize: 12, color: C.tintaSuave, margin: "0 0 10px", lineHeight: 1.5 }}>
              Investiga con IA el foso competitivo, el potencial del mercado/producto y las noticias recientes de la empresa y su sector, y lo convierte en nota.
            </p>
            <Boton pequeno onClick={onCalcular} deshabilitado={calculando}>{calculando ? "Investigando…" : "Calcular con noticias"}</Boton>
          </div>
        )}
      </div>
      {global != null && (
        <div style={{ width: "100%", boxSizing: "border-box", background: C.tinta, color: C.papel, borderRadius: 6, padding: "10px 16px", display: "flex", alignItems: "baseline", gap: 14, flexWrap: "wrap" }}>
          <span style={{ fontFamily: fontData, fontSize: 11, letterSpacing: 1 }}>NOTA GLOBAL · 50 % NÚMEROS + 50 % NEGOCIO</span>
          <span style={{ fontFamily: fontDisplay, fontSize: 26, fontWeight: 700 }}>{global} / 100</span>
          <span style={{ fontSize: 12, opacity: 0.85 }}>{global >= 70 ? "Candidata seria: merece estudio en profundidad" : global >= 45 ? "Interesante con reservas: vigilar precio y riesgos" : "Mejor esperar o descartar por ahora"}</span>
        </div>
      )}
    </div>
  );
}

async function analisisCualitativo(a, anthropicKey) {
  const prompt = construirPromptCualitativo(a, notaCuantitativa(a));
  const resp = await buscarConTope("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!resp.ok) {
    if (resp.status === 401) throw new Error("Clave de Anthropic no válida — revísala en Ajustes");
    throw new Error("fallo de la API");
  }
  const data = await resp.json();
  const texto = (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
  return extraerJSON(texto);
}

// ---------- Informe imprimible / PDF ----------
function escaparHTML(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function construirInformeHTML(a) {
  const cuant = notaCuantitativa(a);
  const cual = a.cualitativa || null;
  const nGlobal = cuant && cual ? Math.round((cuant.nota + cual.nota) / 2) : null;
  const colorSem = { bien: "#1E6B4E", regular: "#8A6D1F", mal: "#B3372E" };
  const textoSem = { bien: "bien", regular: "regular", mal: "flojo" };
  const f = a.filtro || {};
  const colorSello = f.veredicto === "PRECIO ATRACTIVO" ? "#1E6B4E" : f.veredicto === "PRECIO RAZONABLE" ? "#8A6D1F" : "#B3372E";

  let tablas = "";
  gruposIndicadores(a).forEach(function (g) {
    let filas = "";
    g.items.forEach(function (it) {
      const c = it.s ? colorSem[it.s] : "#3D5247";
      const et = it.s ? textoSem[it.s] : "&mdash;";
      /* La marca antes que la palabra: en un papel, «regular» hay que leerlo y
         un punto ámbar se ve. La palabra se queda al lado, que un color solo
         no sirve a quien no los distingue. */
      const marca = it.s ? "<span class=punto style=background:" + c + "></span>" : "";
      filas += "<tr><td>" + escaparHTML(it.e) + "</td><td class=v style=\"color:" + c + ";font-weight:bold\">" + escaparHTML(it.v) + "</td>" +
        "<td class=\"v marca\" style=color:" + c + ">" + marca + et + "</td></tr>";
    });
    tablas += "<table class=tg><tr><th colspan=3 class=grupo>" + escaparHTML(g.titulo) + "</th></tr>" + filas + "</table>";
  });

  /*
   * Una caja solo si tiene qué decir.
   *
   * Antes salían las tres siempre, y las dos de la parte cualitativa vacías
   * mientras no se hubiera pedido: dos tercios del ancho ocupados por un marco
   * con un guion dentro. Un marco vacío no se lee como «pendiente», se lee como
   * un agujero.
   */
  function cajaNota(titulo, nota) {
    if (nota == null) return "";
    return "<div class=caja><div class=cajat>" + titulo + "</div><div class=cajan style=color:" + colorNota(nota) + ">" + nota + " <small>/100</small></div></div>";
  }

  /*
   * El desglose por grupos, en barras.
   *
   * Es lo que de verdad dice en qué va bien y en qué no, y estaba en una línea
   * de nueve puntos con los números entre puntos medios. En barras se mira: la
   * corta se ve sin leer ninguna cifra.
   */
  let barras = "";
  if (cuant) {
    barras = "<div class=barras>" + cuant.desglose.map(function (d) {
      const n = d.nota;
      const ancho = n == null ? 0 : Math.max(2, Math.min(100, n));
      return "<div class=barra>" +
        "<div class=barrat>" + escaparHTML(d.nombre) + "</div>" +
        "<div class=barrac><div class=barraf style=\"width:" + ancho + "%;background:" + (n == null ? "#C9D1C4" : colorNota(n)) + "\"></div></div>" +
        "<div class=barran style=color:" + (n == null ? "#3D5247" : colorNota(n)) + ">" + (n == null ? "&mdash;" : n) + "</div>" +
        "</div>";
    }).join("") + "</div>";
  }

  const cajas = cajaNota("ÍNDICE CUANTITATIVO", cuant ? cuant.nota : null) +
    cajaNota("ÍNDICE CUALITATIVO", cual ? cual.nota : null) +
    cajaNota("NOTA GLOBAL", nGlobal);
  let indices = "<div class=resumen>" +
    (cajas ? "<div class=cajas>" + cajas + "</div>" : "") +
    barras +
    "</div>" +
    (cuant && !cual ? "<div class=nota-pie>El índice cualitativo &mdash;foso, potencial, noticias&mdash; no se ha calculado para esta empresa: se pide desde la ficha y lo escribe un modelo con búsqueda web.</div>" : "");

  let cicloHtml = "";
  if (a.ciclo) {
    cicloHtml = "<div class=sub style=\"border:1.5px solid #8A6D1F;border-radius:6px;padding:8px 12px;margin:10px 0\"><b>⚠ EMPRESA CÍCLICA</b> (" + escaparHTML(a.ciclo.motivo) + ")" +
      (a.ciclo.sobreciclo != null && a.ciclo.sobreciclo >= 1.6 ? " &middot; beneficio actual " + fmt.num(a.ciclo.sobreciclo, 1) + "&times; su media histórica: posible pico de ciclo; PER sobre beneficio medio &asymp; " + fmt.num(a.ciclo.perNormalizado, 0) : "") +
      (a.ciclo.sobreciclo != null && a.ciclo.sobreciclo <= 0.6 ? " &middot; beneficio muy por debajo de su media: posible valle de ciclo" : "") +
      "</div>";
  }
  let tndHtml = "";
  if (a.tendencia) {
    const tnd = a.tendencia;
    function flecha(v) { return v == null ? "&mdash;" : (v > 0 ? "+" : "") + (v * 100).toFixed(1).replace(".", ",") + " %"; }
    tndHtml = "<h2>Tendencia" + (tnd.modo === "anual" ? " (comparación entre ejercicios anuales)" : ": últimos 12 meses vs 12 anteriores") + "</h2>" +
      "<div class=sub>Ventas <b>" + flecha(tnd.crecVentas) + "</b> &middot; Beneficio neto <b>" + flecha(tnd.crecNeto) + "</b> &middot; EPS <b>" + flecha(tnd.crecEPS) + "</b><br>" +
      "Margen bruto " + fmt.pct(tnd.margenBrutoAnt) + " &rarr; " + fmt.pct(tnd.margenBrutoAct) +
      " &middot; Margen operativo " + fmt.pct(tnd.margenOpAnt) + " &rarr; " + fmt.pct(tnd.margenOpAct) +
      " &middot; Margen neto " + fmt.pct(tnd.margenNetoAnt) + " &rarr; " + fmt.pct(tnd.margenNetoAct) + "</div>";
  }

  let cualHtml = "";
  if (cual) {
    cualHtml = "<h2>Análisis cualitativo (IA + noticias" + (cual.fecha ? ", " + new Date(cual.fecha).toLocaleDateString("es-ES") : "") + ")</h2>" +
      "<div class=sub>Foso competitivo " + (cual.foso || 0) + "/10 &middot; Potencial mercado/producto " + (cual.potencial || 0) + "/10 &middot; Noticias y tendencias " + (cual.vientos || 0) + "/10 &middot; Gestión y riesgos " + (cual.gestionRiesgos || 0) + "/10</div>" +
      "<p>" + escaparHTML(cual.resumen) + "</p>" +
      (cual.positivo || []).map(function (x) { return "<div class=pro>+ " + escaparHTML(x) + "</div>"; }).join("") +
      (cual.negativo || []).map(function (x) { return "<div class=contra>&minus; " + escaparHTML(x) + "</div>"; }).join("");
  }

  let proyHtml = "";
  if (a.val) {
    /* Cuatro cifras alineadas y no un párrafo con los números dentro: en un
       papel se buscan con la vista, no se leen de corrido. */
    const cifra = function (t, v, destacar) {
      return "<div class=cifra><div class=cifrat>" + t + "</div><div class=cifran" + (destacar ? " style=color:" + (a.val.potencial >= 0 ? "#1E6B4E" : "#B3372E") : "") + ">" + v + "</div></div>";
    };
    proyHtml = "<h2>Proyección a 5 años &middot; rentabilidad esperada</h2>" +
      "<div class=cifras>" +
        cifra("PRECIO ESTIMADO", fmt.moneda(a.val.precio5, a.moneda), false) +
        cifra("POTENCIAL", fmt.pct(a.val.potencial, 0), true) +
        cifra("TIR 3 AÑOS", fmt.pct(a.val.tir3), false) +
        cifra("TIR 5 AÑOS", fmt.pct(a.val.tir5), false) +
      "</div>" +
      "<div class=sub>Supuestos: crecimiento del EPS al " + fmt.pct(a.val.g) + " (tope 25 %) y PER objetivo " + fmt.num(a.val.perObjetivo, 0) + ", dividendo incluido.</div>";
  }

  return "<!DOCTYPE html><html lang=es><head><meta charset=utf-8><title>Informe " + escaparHTML(a.ticker) + " — Delfos 2000</title><style>" +
    "*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}" +
    "body{font-family:Georgia,'Times New Roman',serif;color:#14231C;margin:30px;font-size:12px;line-height:1.45}" +
    "h1{font-size:22px;margin:0}h2{font-size:14px;margin:16px 0 4px;border-bottom:1px solid #C9D1C4;padding-bottom:3px}" +
    ".mono{font-family:Consolas,Menlo,monospace}" +
    ".cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #14231C;padding-bottom:10px;flex-wrap:wrap;gap:10px}" +
    ".sello{display:inline-block;border:2.5px solid " + colorSello + ";color:" + colorSello + ";border-radius:6px;padding:5px 12px;font-family:Consolas,monospace;font-weight:bold;letter-spacing:2px;font-size:13px;transform:rotate(-3deg)}" +
    ".sub{font-size:11px;color:#3D5247;margin:4px 0}" +
    ".cajas{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}" +
    ".caja{border:1.5px solid #14231C;border-radius:6px;padding:8px 14px;min-width:150px}" +
    ".cajat{font-family:Consolas,monospace;font-size:9px;letter-spacing:1px;color:#3D5247}" +
    ".cajan{font-size:24px;font-weight:bold}.cajan small{font-size:11px;color:#3D5247;font-weight:normal}" +
    ".cols{display:flex;flex-wrap:wrap;gap:0 20px;margin-top:6px}" +
    ".tg{width:calc(50% - 10px);border-collapse:collapse;font-size:10.5px;margin-bottom:8px}" +
    ".tg td{padding:3px 4px;border-bottom:1px dotted #C9D1C4}" +
    ".tg .v{text-align:right;font-family:Consolas,monospace;white-space:nowrap}" +
    ".grupo{font-family:Consolas,monospace;font-size:9px;letter-spacing:1.5px;color:#8A6D1F;text-align:left;padding:8px 4px 3px}" +
    ".pro{font-size:11px;color:#1E6B4E;margin:2px 0}.contra{font-size:11px;color:#B3372E;margin:2px 0}" +

    ".resumen{display:flex;gap:18px;align-items:flex-start;margin:14px 0 4px;flex-wrap:wrap}" +
    ".barras{flex:1;min-width:260px}" +
    ".barra{display:flex;align-items:center;gap:8px;margin:3px 0}" +
    ".barrat{width:88px;font-size:9.5px;color:#3D5247;text-align:right}" +
    ".barrac{flex:1;height:7px;background:#EDF1EC;border-radius:4px;overflow:hidden}" +

    ".punto{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}" +
    ".marca{width:66px}" +
    "@page{margin:13mm}" +
    "</st" + "yle></head><body>" +
    "<div class=cab><div>" +
    "<div class=mono style=font-size:10px;letter-spacing:1px;color:#3D5247>DELFOS 2000 &middot; INFORME DE ANÁLISIS &middot; " + new Date().toLocaleDateString("es-ES") + "</div>" +
    "<h1>" + escaparHTML(a.nombre) + " <span class=mono style=font-size:14px>(" + escaparHTML(a.ticker) + ")</span></h1>" +
    "<div class=sub>" + escaparHTML(a.sector || "") + " &middot; " + escaparHTML(a.industria || "") + " &middot; " + escaparHTML(a.pais || "") + "</div>" +
    "<div class=mono style=font-size:16px;font-weight:bold;margin-top:6px>" + fmt.moneda(a.precio, a.moneda) + " <span style=font-size:10px;font-weight:normal;color:#3D5247>&middot; Cap. " + fmt.cap(a.cap) + " &middot; Rango 52s " + escaparHTML(a.rango52) + "</span></div>" +
    "</div><div style=text-align:right><div class=sello>" + escaparHTML(f.veredicto || "") + "</div><div class=sub style=max-width:200px>" + escaparHTML(f.detalle || "") + "</div></div></div>" +
    indices + cicloHtml + proyHtml + tndHtml + cualHtml +
    "<h2>Indicadores</h2><div class=cols>" + tablas + "</div>" +
    "<div class=pie>Metodología: filtro de múltiplos ajustados al crecimiento (Peter Lynch) y proyección de rentabilidad esperada. Herramienta de análisis personal: este informe no constituye asesoramiento financiero ni una recomendación de compra o venta.</div>" +
    "</body></html>";
}

/*
 * El papel de la lista de seguimiento.
 *
 * Lo que se quiere ver impreso no es la tabla de la pantalla: es qué se está
 * siguiendo, desde cuándo, y si fijarse en ello habría servido. Por eso la
 * cartera virtual va arriba y grande, y la señal de cada una al lado del nombre.
 */
function construirInformeSeguimiento(filas, cartera) {
  const dia = new Date().toLocaleDateString("es-ES");
  const pct = function (v) { return v == null ? "&mdash;" : (v >= 0 ? "+" : "") + fmt.pct(v); };
  const color = function (v) { return v == null ? "#3D5247" : v >= 0 ? "#1E6B4E" : "#B3372E"; };

  const cuerpo = filas.map(function (f) {
    const nota = f.ult && f.ult.nota != null ? f.ult.nota : null;
    return "<tr>" +
      "<td><b class=mono>" + escaparHTML(f.t) + "</b>" +
        (f.a && f.a.nombre ? " <span style=color:#3D5247>" + escaparHTML(f.a.nombre) + "</span>" : "") +
        (f.senal ? "<div style=font-size:9px;color:" + f.senal.color + ">" + escaparHTML(f.senal.texto) + "</div>" : "") +
      "</td>" +
      "<td class=v>" + (f.entrada ? new Date(f.entrada.fecha).toLocaleDateString("es-ES") : "&mdash;") + "</td>" +
      "<td class=v>" + (f.entrada && f.entrada.precio != null ? fmt.num(f.entrada.precio) : "&mdash;") + "</td>" +
      "<td class=v>" + (f.ult && f.ult.precio != null ? fmt.num(f.ult.precio) : "&mdash;") + "</td>" +
      "<td class=v style=\"font-weight:bold;color:" + color(f.desdeEntrada) + "\">" + pct(f.desdeEntrada) +
        (f.diasDentro != null ? "<div style=font-size:9px;font-weight:normal;color:#3D5247>" + f.diasDentro + " días</div>" : "") +
      "</td>" +
      "<td class=v>" + (nota == null ? "&mdash;" : nota) + "</td>" +
      "</tr>";
  }).join("");

  const resumen = cartera
    ? "<div class=cajas>" +

/*
 * Mandar un papel a la impresora, que es como se saca un PDF desde el navegador.
 *
 * Por un marco escondido, y si el entorno no deja, por una ventana nueva. Lo
 * usan los dos informes: duplicarlo era garantizar que uno de los dos se quedara
 * sin el respaldo.
 */
function imprimirHTML(html) {
  let iframe = document.getElementById("marco-informe-pdf");
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.id = "marco-informe-pdf";
    iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
    document.body.appendChild(iframe);
  }
  const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
  if (doc) {
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(function () {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        return;
      } catch (e) { /* sandbox: probamos con ventana nueva */ }
      try {
        const w = window.open("", "_blank");
        w.document.write(html);
        w.document.close();
        setTimeout(function () { try { w.print(); } catch (e) {} }, 400);
      } catch (e2) { /* bloqueado por el entorno */ }
    }, 350);
  }
}

// ---------- Tendencia 12 meses: TTM actual vs TTM anterior ----------
function semDelta(act, ant) {
  if (act == null || ant == null || isNaN(act) || isNaN(ant)) return null;
  const d = act - ant;
  return d > 0.005 ? "bien" : d >= -0.005 ? "regular" : "mal";
}

function calcularTendenciaFilas(filasN, modo) {
  function suma(arr, campo) {
    let s = 0, n = 0;
    arr.forEach(function (x) { const v = x[campo]; if (typeof v === "number" && !isNaN(v)) { s += v; n++; } });
    return n ? s : null;
  }
  let act, ant, filas;
  if (modo === "trimestral") {
    filas = filasN.slice(0, 8);
    act = filas.slice(0, 4);
    ant = filas.slice(4, 8);
  } else {
    filas = filasN.slice(0, 3);
    act = [filas[0]];
    ant = filas.length > 1 ? [filas[1]] : [];
  }
  const completo = modo === "trimestral" ? ant.length >= 4 : ant.length >= 1;
  function crec(a, b) { return a != null && b != null && b !== 0 ? (a - b) / Math.abs(b) : null; }
  function margen(x, y) { return x != null && y ? x / y : null; }
  const vAct = suma(act, "revenue"), vAnt = completo ? suma(ant, "revenue") : null;
  const nAct = suma(act, "netIncome"), nAnt = completo ? suma(ant, "netIncome") : null;
  const oAct = suma(act, "operatingIncome"), oAnt = completo ? suma(ant, "operatingIncome") : null;
  const bAct = suma(act, "grossProfit"), bAnt = completo ? suma(ant, "grossProfit") : null;
  const eAct = suma(act, "epsD"), eAnt = completo ? suma(ant, "epsD") : null;
  const invertida = filas.slice().reverse();
  return {
    modo: modo,
    completo: completo,
    crecVentas: crec(vAct, vAnt),
    crecNeto: crec(nAct, nAnt),
    crecEPS: crec(eAct, eAnt),
    margenBrutoAct: margen(bAct, vAct), margenBrutoAnt: margen(bAnt, vAnt),
    margenOpAct: margen(oAct, vAct), margenOpAnt: margen(oAnt, vAnt),
    margenNetoAct: margen(nAct, vAct), margenNetoAnt: margen(nAnt, vAnt),
    ventasSerie: invertida.map(function (x) { return x.revenue; }),
    epsSerie: invertida.map(function (x) { return x.epsD; }),
    trimestres: invertida.map(function (x) { return x.etiqueta; }),
    fecha: new Date().toISOString(),
  };
}

// ---------- ROIC.ai: fuente secundaria (cobertura mundial, clave gratuita) ----------
function pausa(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// También pasa por el servidor de Delfos: pone la clave y, de paso, evita
// el bloqueo de CORS que obligaba a montar un puente en Cloudflare.
let ROIC_BASE = "/api/roic/v2";
function fijarProxyRoic(url) {
  ROIC_BASE = url && url.trim() ? url.trim().replace(/\/+$/, "") + "/v2" : "/api/roic/v2";
}

async function roicFetch(path, apiKey, esReintento) {
  const sep = path.indexOf("?") !== -1 ? "&" : "?";
  let r;
  try {
    r = await buscarConTope(ROIC_BASE + path + sep + "apikey=" + apiKey);
  } catch (e) {
    if (ROIC_BASE.indexOf("api.roic.ai") !== -1) {
      throw new Error("El navegador bloquea la conexión directa con ROIC.ai (CORS). Crea el puente gratuito con el archivo puente-roic.js y pega su URL en Ajustes.");
    }
    throw new Error("El puente de ROIC.ai no responde — revisa su URL en Ajustes");
  }
  let data = null;
  try { data = await r.json(); } catch (e) { /* respuesta no JSON */ }
  if (r.status === 401) throw new Error("Clave de ROIC.ai no válida — revísala en Ajustes");
  if (r.status === 429) {
    if (!esReintento) {
      // Dejamos respirar el minuto del plan gratuito y reintentamos una única vez
      await pausa(13000);
      return roicFetch(path, apiKey, true);
    }
    throw new Error("Límite de ROIC.ai alcanzado (5 consultas/minuto en el plan gratuito) — espera un minuto y reintenta");
  }
  if (!r.ok) {
    const msg = data && (data.message || data.error);
    throw new Error("Error consultando ROIC.ai (" + r.status + ")" + (msg ? ": " + msg : ""));
  }
  return data;
}

function normalizarSeriePrecios(arr) {
  const out = [];
  (arr || []).forEach(function (x) {
    const p = elegir(x, ["close", "adjClose", "adj_close", "price", "px_last"]);
    const f = x.date || x.datetime;
    if (typeof p === "number" && !isNaN(p) && f) {
      const t = new Date(String(f).slice(0, 10)).getTime();
      if (!isNaN(t)) out.push({ t: t, p: p });
    }
  });
  out.sort(function (a, b) { return a.t - b.t; });
  return out;
}

async function preciosHistoricosFmp(ticker, apiKey) {
  const t = ticker.trim().toUpperCase();
  const d = await fmpDual(
    "historical-price-eod/light?symbol=" + t,
    "historical-price-full/" + t + "?serietype=line",
    apiKey
  );
  const arr = Array.isArray(d) ? d : (d && d.historical) || [];
  return normalizarSeriePrecios(arr);
}

async function preciosHistoricosRoic(ticker, roicKey) {
  const t = ticker.trim().toUpperCase();
  const hoy = new Date();
  const desde = new Date();
  desde.setFullYear(hoy.getFullYear() - 5);
  const fecha = function (d) { return d.toISOString().slice(0, 10); };
  const q = "?from=" + fecha(desde) + "&to=" + fecha(hoy);
  let d;
  try {
    d = await roicFetch("/stock-prices/" + encodeURIComponent(t) + q, roicKey);
  } catch (e) {
    d = await roicFetch("/stock-prices/historical/" + encodeURIComponent(t) + q, roicKey);
  }
  return normalizarSeriePrecios(Array.isArray(d) ? d : (d && d.data) || []);
}

function GraficoPrecio({ serie, moneda }) {
  const [rango, setRango] = useState(1825);
  if (!serie || serie.length < 2) return null;
  const corte = rango ? Date.now() - rango * 86400000 : 0;
  let pts = serie.filter(function (x) { return x.t >= corte; });
  if (pts.length < 2) pts = serie;
  const paso = Math.max(1, Math.ceil(pts.length / 320));
  const mues = pts.filter(function (_, i) { return i % paso === 0 || i === pts.length - 1; });
  let min = Infinity, max = -Infinity;
  mues.forEach(function (x) { if (x.p < min) min = x.p; if (x.p > max) max = x.p; });
  const rangoY = max - min || 1;
  const W = 600, H = 150, PAD = 6;
  const X = function (i) { return PAD + (i / (mues.length - 1)) * (W - 2 * PAD); };
  const Y = function (p) { return H - PAD - ((p - min) / rangoY) * (H - 2 * PAD); };
  const linea = mues.map(function (x, i) { return X(i).toFixed(1) + "," + Y(x.p).toFixed(1); }).join(" ");
  const primero = mues[0], ultimo = mues[mues.length - 1];
  const variacion = ultimo.p / primero.p - 1;
  const color = variacion >= 0 ? C.verde : C.rojo;
  const rangos = [["1A", 365], ["2A", 730], ["5A", 1825], ["Todo", 0]];
  function fechaCorta(t) { return new Date(t).toLocaleDateString("es-ES", { month: "short", year: "2-digit" }); }
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8, margin: "8px 0 4px" }}>
        <div style={{ fontFamily: fontData, fontSize: 13 }}>
          <b>{fmt.moneda(ultimo.p, moneda)}</b>
          <span style={{ color: color, marginLeft: 8, fontWeight: 700 }}>{(variacion >= 0 ? "+" : "") + fmt.pct(variacion, 1)}</span>
          <span style={{ color: C.tintaSuave, fontSize: 11, marginLeft: 6 }}>en el periodo</span>
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          {rangos.map(function (r) {
            return (
              <button key={r[0]} onClick={function () { setRango(r[1]); }}
                style={{ background: rango === r[1] ? C.tinta : "transparent", color: rango === r[1] ? C.papel : C.tintaSuave, border: "1px solid " + C.linea, borderRadius: 4, padding: "2px 8px", fontSize: 11, fontFamily: fontData, cursor: "pointer" }}>
                {r[0]}
              </button>
            );
          })}
        </div>
      </div>
      <svg viewBox={"0 0 " + W + " " + (H + 16)} style={{ width: "100%", display: "block" }}>
        <polyline points={linea + " " + X(mues.length - 1).toFixed(1) + "," + (H - PAD) + " " + X(0).toFixed(1) + "," + (H - PAD)} fill={color + "22"} stroke="none" />
        <polyline points={linea} fill="none" stroke={color} strokeWidth="2" />
        <text x={PAD} y={H + 12} fontSize="10" fill={C.tintaSuave} fontFamily="monospace">{fechaCorta(primero.t)}</text>
        <text x={W - PAD} y={H + 12} fontSize="10" fill={C.tintaSuave} fontFamily="monospace" textAnchor="end">{fechaCorta(ultimo.t)}</text>
        <text x={W - PAD} y={Y(max) + 10} fontSize="10" fill={C.tintaSuave} fontFamily="monospace" textAnchor="end">{fmt.num(max)}</text>
        <text x={W - PAD} y={Y(min) - 4} fontSize="10" fill={C.tintaSuave} fontFamily="monospace" textAnchor="end">{fmt.num(min)}</text>
      </svg>
    </div>
  );
}

async function cotizacionRadar(t, apiKey) {
  const q = await fmpDual("quote?symbol=" + t, "quote/" + t, apiKey);
  const x = (q && q[0]) || {};
  const precio = x.price;
  const dia = elegir(x, ["changesPercentage", "changePercentage"]);
  const max52 = x.yearHigh;
  return {
    nombre: x.name || null,
    precio: typeof precio === "number" ? precio : null,
    dia: typeof dia === "number" ? dia / 100 : null,
    drawdown: typeof precio === "number" && typeof max52 === "number" && max52 > 0 ? precio / max52 - 1 : null,
  };
}

// ETFs que el plan ya ha rechazado en esta sesión: no se reintenta y se ahorra la consulta
const ETF_VETADO = {};

// Mide un sector: primero su ETF; si el plan no lo incluye, promedia 2 valores representativos
async function medirSector(s, apiKey, registrarMotivo) {
  try {
    if (ETF_VETADO[s.t]) throw new Error("ETF vetado por el plan en esta sesión");
    const c = await cotizacionRadar(s.t, apiKey);
    if (c.drawdown == null) throw new Error("ETF sin datos");
    return { nombre: s.nombre, ticker: s.t, precio: c.precio, dia: c.dia, drawdown: c.drawdown };
  } catch (e) {
    if (e && e.message && e.message.indexOf("no entra en el plan") !== -1) ETF_VETADO[s.t] = true;
    if (registrarMotivo && (!e.message || e.message.indexOf("vetado") === -1)) registrarMotivo(e);
    if (!s.respaldo || !s.respaldo.length) return { nombre: s.nombre, ticker: s.t, precio: null, dia: null, drawdown: null };
    const parciales = await Promise.all(s.respaldo.map(function (r) {
      return cotizacionRadar(r, apiKey).catch(function (e2) { if (registrarMotivo) registrarMotivo(e2); return null; });
    }));
    const validos = parciales.filter(function (p) { return p && p.drawdown != null; });
    if (!validos.length) return { nombre: s.nombre, ticker: s.t, precio: null, dia: null, drawdown: null };
    function media(campo) {
      const nums = validos.map(function (p) { return p[campo]; }).filter(function (v) { return typeof v === "number"; });
      return nums.length ? nums.reduce(function (a, b) { return a + b; }, 0) / nums.length : null;
    }
    return { nombre: s.nombre, ticker: s.respaldo.join("+"), precio: null, dia: media("dia"), drawdown: media("drawdown"), proxy: true };
  }
}

async function escanearMercado(apiKey) {
  const resultados = [];
  let motivo = null;
  function registrar(e) { if (!motivo && e && e.message) motivo = e.message; }
  for (let i = 0; i < RADAR_UNIVERSO.length; i += 2) {
    const lote = RADAR_UNIVERSO.slice(i, i + 2);
    const parciales = await Promise.all(lote.map(function (s) { return medirSector(s, apiKey, registrar); }));
    parciales.forEach(function (p) { resultados.push(p); });
    if (i + 2 < RADAR_UNIVERSO.length) await new Promise(function (r) { setTimeout(r, 450); });
  }
  resultados.sort(function (a, b) { return (a.drawdown == null ? 1 : a.drawdown) - (b.drawdown == null ? 1 : b.drawdown); });
  const sinDatos = resultados.filter(function (r) { return r.drawdown == null; }).length;
  if (sinDatos === resultados.length) {
    throw new Error("El escaneo no ha devuelto datos" + (motivo ? " — motivo: " + motivo : ""));
  }
  if (sinDatos > 0 && motivo) resultados.motivo = motivo;
  return resultados;
}

async function generarAnalisisRadar(filas, anthropicKey) {
  const resp = await buscarConTope("https://api.anthropic.com/v1/messages", {

      "x-api-key": anthropicKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: promptRadar(filas) }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!resp.ok) {
    if (resp.status === 401) throw new Error("Clave de Anthropic no válida — revísala en Ajustes");

  }
  const data = await resp.json();
  return (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
}

function Radar({ apiKey, roicKey, analisis, setAnalisis, abrirAnalisis, anthropicKey, radar, setRadar, setAviso, irAAjustes }) {
  const [escaneando, setEscaneando] = useState(false);
  const [analizando, setAnalizando] = useState(false);
  const [abierto, setAbierto] = useState(null);
  const [cargandoDetalle, setCargandoDetalle] = useState(null);
  const [calculandoNotas, setCalculandoNotas] = useState(null);

  const alternarDetalle = async (f) => {
    const cfg = RADAR_UNIVERSO.find(function (u) { return u.nombre === f.nombre; });
    if (!cfg || !cfg.consulta) { setAviso("El detalle por empresas no está disponible para mercados fuera de EE. UU. con tu plan"); return; }
    if (abierto === f.nombre) { setAbierto(null); return; }
    setAbierto(f.nombre);
    if (f.empresas && f.empresas.length) return;
    if (cargandoDetalle) return;
    setCargandoDetalle(f.nombre);
    try {
      const empresas = await detalleSector(cfg, apiKey);
      setRadar({ ...radar, filas: radar.filas.map(function (x) { return x.nombre === f.nombre ? { ...x, empresas: empresas } : x; }) });
    } catch (e) { setAviso(e.message); setAbierto(null); }
    setCargandoDetalle(null);
  };

  const calcularNotasSector = async (f) => {
    if (calculandoNotas || !f.empresas) return;
    setCalculandoNotas(f.nombre);
    const nuevoAnalisis = { ...analisis };
    for (let i = 0; i < f.empresas.length; i++) {
      const t = f.empresas[i].ticker;
      if (nuevoAnalisis[t]) continue;
      try {
        const a = await analizarDual(t, apiKey, roicKey);
        if (a) nuevoAnalisis[t] = a;
      } catch (e) { /* siguiente */ }
      await new Promise(function (r) { setTimeout(r, 350); });
    }
    setAnalisis(nuevoAnalisis);
    setCalculandoNotas(null);
  };

    if (!apiKey) { setAviso("Guarda tu clave de FMP en Ajustes"); irAAjustes(); return; }
    setEscaneando(true);

      const filas = await escanearMercado(apiKey);

    } catch (e) { setAviso(e.message && e.message.indexOf("Anthropic") !== -1 ? e.message : "No se ha podido generar el análisis del radar — inténtalo de nuevo"); }
